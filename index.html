<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>御剑问仙 · 山海纪</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ebe3cd; --ink:#2b2620; --jade:#2e8467; --gold:#a97c22; --cinnabar:#b23a2a;
  --spirit:#2a7fa8; --stone:#7d756a; --violet:#6b4a8e; --rose:#b8476e;
  --panel:rgba(246,240,226,.97); --panel2:rgba(235,226,204,.9); --line:rgba(43,38,32,.2); --veil:rgba(235,227,205,.84); --wood:#8a6a44;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161d26; --ink:#e7dfca; --jade:#72ccab; --gold:#e3bd62; --cinnabar:#e2614b;
    --spirit:#80c8ec; --stone:#9a9284; --violet:#b597dc; --rose:#e88fb0;
    --panel:rgba(26,34,45,.97); --panel2:rgba(34,44,58,.92); --line:rgba(231,223,202,.2); --veil:rgba(22,29,38,.86); --wood:#6e5338;
  }
}
:root[data-theme="dark"]{
  --bg:#161d26; --ink:#e7dfca; --jade:#72ccab; --gold:#e3bd62; --cinnabar:#e2614b;
  --spirit:#80c8ec; --stone:#9a9284; --violet:#b597dc; --rose:#e88fb0;
  --panel:rgba(26,34,45,.97); --panel2:rgba(34,44,58,.92); --line:rgba(231,223,202,.2); --veil:rgba(22,29,38,.86); --wood:#6e5338;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
[hidden]{display:none!important}
h1,h2,.glyph,.kai,.seal-node{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;font-weight:400}
.r0{color:var(--stone)}.r1{color:var(--jade)}.r2{color:var(--spirit)}.r3{color:var(--violet)}.r4{color:var(--gold)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
#realm{font-size:24px;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0}
#hpbar{flex:1;max-width:260px;height:12px;border:1px solid var(--line)}
#hpbar i{background:var(--cinnabar)}
#hptxt{font-size:12px;font-variant-numeric:tabular-nums;min-width:70px}
#xpbar{height:5px;margin-top:6px}
#xpbar i{background:var(--spirit)}
#obj{margin-left:auto;font-size:14px;font-weight:700;text-align:right}
#obj small{display:block;font-weight:400;font-size:12px;color:var(--cinnabar)}
.round{pointer-events:auto;width:34px;height:34px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:50%;font:13px serif;cursor:pointer;flex:none}
#info{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px}
#info b{color:var(--gold)}
#skills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;max-width:620px}
#skills span{font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
#skills span.evo{border-color:var(--gold);color:var(--gold)}
#skills span.p{opacity:.7}
#skills sub{font-size:9px;color:var(--gold);margin-left:2px;vertical-align:baseline}
#boss{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(440px,84vw);text-align:center;pointer-events:none}
#bossname{font-size:22px;color:var(--cinnabar)}
#bossbar{height:8px;border:1px solid var(--cinnabar);margin-top:4px}
#bossbar i{background:var(--cinnabar)}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(30px,7.5vw,52px);color:var(--cinnabar);pointer-events:none;opacity:0;padding:0 16px}
#banner.show{animation:ban 1.9s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

/* overlay & panels */
.overlay{position:fixed;inset:0;display:flex;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
.panel{width:100%;max-width:760px;text-align:center;margin:auto}
h1{font-size:clamp(60px,15vw,112px);line-height:1;margin:0;letter-spacing:.06em;display:inline-flex;align-items:flex-start;gap:14px}
.seal{writing-mode:vertical-rl;font-size:18px;letter-spacing:.1em;background:var(--cinnabar);color:var(--bg);padding:8px 5px;border-radius:3px;transform:rotate(4deg);margin-top:10px;font-family:"Noto Serif SC",serif;font-weight:700}
h2{font-size:clamp(38px,8.5vw,60px);line-height:1.1;margin:0}
h3{font-size:16px;margin:20px 0 10px;text-align:left;font-weight:700}
.sub{font-size:17px;margin:10px 0 0}
.story{font-size:17px;line-height:1.9;max-width:30em;margin:16px auto 0;text-align:left}
.help{font-size:14px;line-height:1.75;opacity:.75;max-width:34em;margin:12px auto 0}
.pts{font-size:16px;margin-top:12px}
.pts b{font-size:22px;color:var(--gold);margin-left:4px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.vlist{display:flex;flex-direction:column;gap:10px;max-width:30em;margin:20px auto 0}
.vlist .btn{width:100%;text-align:left;letter-spacing:0;font-size:16px;line-height:1.5}
.btn small,.vlist .btn small{display:block;font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.btn{font:700 17px "Noto Serif SC",serif;padding:11px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:2px;cursor:pointer;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
.btn.sm{font-size:14px;padding:7px 13px;letter-spacing:0;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.toggles{display:flex;gap:8px;justify-content:center;margin-top:16px}
.toggle{font:14px "Noto Serif SC",serif;padding:6px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--jade);color:var(--jade)}
button:focus-visible,[data-act]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.stats{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}
.stats div{font-size:13px;opacity:.85}
.stats b{display:block;font-size:22px;margin-top:2px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px 18px;min-height:210px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;cursor:pointer;text-align:center}
.card::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);opacity:.45;pointer-events:none}
.card.evo{box-shadow:0 0 0 2px var(--gold)}
.card .glyph{font-size:50px;line-height:1;color:var(--cinnabar)}
.card.cat-g .glyph{color:var(--spirit)} .card.cat-p .glyph{color:var(--jade)} .card.evo .glyph{color:var(--gold)}
.card .t{display:flex;flex-direction:column;gap:3px}
.card b{font-size:19px}
.card em{font-style:normal;font-size:12px;color:var(--gold)}
.card .d{font-size:13px;line-height:1.6;opacity:.82}
.card kbd{position:absolute;top:8px;right:10px;font:12px serif;opacity:.45}
.card[aria-pressed="true"]{box-shadow:0 0 0 2px var(--cinnabar)}
@media (hover:hover){.card{transition:transform .15s}.card:hover{transform:translateY(-3px)}}
@media (pointer:coarse){.card kbd{display:none}}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;text-align:left}
.pickc{display:flex;flex-direction:column;gap:3px;padding:11px 13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;cursor:pointer;text-align:left}
.pickc b{font-size:17px} .pickc em{font-style:normal;font-size:12px;color:var(--gold)} .pickc span{font-size:12px;opacity:.78;line-height:1.5}
.pickc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--cinnabar);border-color:var(--cinnabar)}
.pickc:disabled{opacity:.4;cursor:default}

/* meta list */
.mlist{display:flex;flex-direction:column;gap:7px;text-align:left}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px 12px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.mrow b{font-size:16px;margin-right:8px}
.pips{color:var(--gold);letter-spacing:2px;font-size:12px}
.mdesc{grid-column:1;font-size:12px;opacity:.75;line-height:1.5}
.mrow .btn{grid-row:1 / span 2;grid-column:2}

/* map */
.mapwrap{position:relative;max-width:520px;margin:10px auto 0;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px}
.mapwrap::before,.mapwrap::after{content:"";position:absolute;left:-8px;right:-8px;height:12px;background:var(--wood);border-radius:6px}
.mapwrap::before{top:-8px}.mapwrap::after{bottom:-8px}
.mapsvg{display:block;width:100%;height:auto}
.mapsvg .edge{stroke:var(--ink);stroke-opacity:.25;stroke-width:.5;stroke-dasharray:1.2 1.2}
.mapsvg .edge.walked{stroke:var(--cinnabar);stroke-opacity:.8;stroke-dasharray:none;stroke-width:.7}
.mapsvg .node circle{fill:var(--panel);stroke:var(--ink);stroke-opacity:.45;stroke-width:.5}
.mapsvg .node text{fill:var(--ink);font-size:5px;text-anchor:middle;dominant-baseline:central;font-family:"Ma Shan Zheng","Kaiti SC","STKaiti",serif}
.mapsvg .node.done circle{fill:var(--line)} .mapsvg .node.done text{opacity:.4}
.mapsvg .node.here circle{fill:var(--cinnabar);stroke:var(--cinnabar)} .mapsvg .node.here text{fill:#fff}
.mapsvg .node.open{cursor:pointer}
.mapsvg .node.open circle{stroke:var(--cinnabar);stroke-opacity:1;stroke-width:.9;animation:pulse 1.4s ease-in-out infinite}
.mapsvg .node.t-elite text{fill:var(--cinnabar)} .mapsvg .node.t-boss text{fill:var(--cinnabar)} .mapsvg .node.t-event text{fill:var(--gold)} .mapsvg .node.t-shop text{fill:var(--jade)} .mapsvg .node.t-rest text{fill:var(--spirit)} .mapsvg .node.t-treasure text{fill:var(--violet)}
@keyframes pulse{50%{stroke-width:1.6}}
.maphead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:center;font-size:14px}
.maphead b{color:var(--gold)}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--cinnabar);color:#fff;font-size:12px;line-height:18px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;opacity:.75;margin-top:12px}

/* bag / items */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;padding:8px 6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;font:inherit;color:var(--ink);cursor:pointer;text-align:center}
.item .glyph{font-size:28px;line-height:1}
.item b{font-size:13px;font-weight:700}
.item small{font-size:11px;opacity:.7}
.item.rb0{border-color:var(--stone)}.item.rb1{border-color:var(--jade)}.item.rb2{border-color:var(--spirit)}.item.rb3{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet)}.item.rb4{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.item.empty{opacity:.45;cursor:default}
.item[aria-pressed="true"]{outline:2px solid var(--cinnabar);outline-offset:2px}
.baggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.detail{margin-top:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:3px;text-align:left;font-size:14px;line-height:1.7}
.detail h4{margin:0 0 4px;font-size:18px}
.detail .cmp{opacity:.7;font-size:12px}
.up{color:var(--jade)}.down{color:var(--cinnabar)}

/* attributes */
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;text-align:left}
.attr{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.attr .glyph{font-size:30px;color:var(--cinnabar);grid-row:1 / span 2}
.attr b{font-size:16px} .attr span{font-size:12px;opacity:.75;grid-column:2}
.attr .btn{grid-row:1 / span 2;grid-column:3;width:40px;height:40px;padding:0;font-size:20px}
.statlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px 14px;text-align:left;font-size:13px;margin-top:10px}
.statlist div{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}

/* shop */
.goods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.good{display:flex;flex-direction:column;gap:4px;padding:11px;background:var(--panel);border:1px solid var(--line);border-radius:3px;text-align:left}
.good b{font-size:15px} .good span{font-size:12px;opacity:.75;line-height:1.5;flex:1}
.good.sold{opacity:.35}

/* events: library */
.shelf{display:flex;justify-content:center;gap:6px;padding:14px 10px 0;background:linear-gradient(transparent calc(100% - 12px),var(--wood) 0);border-radius:3px;flex-wrap:wrap}
.book{writing-mode:vertical-rl;width:46px;height:170px;padding:10px 4px;border:1px solid var(--ink);border-radius:2px 2px 0 0;font:700 15px "Noto Serif SC",serif;letter-spacing:.15em;cursor:pointer;color:var(--bg);display:flex;align-items:center;justify-content:flex-start;position:relative}
.book::after{content:"";position:absolute;left:3px;right:3px;top:14px;height:2px;background:var(--gold);opacity:.7}
.book.cw{background:var(--cinnabar)}.book.cg{background:var(--spirit)}.book.cp{background:var(--jade)}
.book[aria-pressed="true"]{transform:translateY(-14px);box-shadow:0 6px 0 var(--gold)}
.book.taken{opacity:.25;cursor:default}
/* event visuals */
.scene-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.pickable{background:none;border:none;padding:4px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:6px}
.pickable svg{display:block}
.pickable span{font-size:12px;opacity:.8;max-width:96px;line-height:1.4}
.pickable:disabled{opacity:.35;cursor:default}
.pickable[aria-pressed="true"]{background:var(--panel)}
.pickable:hover:not(:disabled) svg{transform:translateY(-3px)}
.gauge{position:relative;height:30px;max-width:420px;margin:22px auto 0;background:var(--line);border-radius:15px;overflow:hidden}
.gauge .zg{position:absolute;top:0;bottom:0;background:var(--jade);opacity:.45}
.gauge .zp{position:absolute;top:0;bottom:0;background:var(--gold)}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--cinnabar)}
.furnace{font-size:64px;line-height:1;margin-top:10px}
.stele{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center;margin-top:18px;padding:14px;background:var(--stone);border-radius:8px 8px 3px 3px;width:max-content;margin-left:auto;margin-right:auto}
.stele button{width:72px;height:72px;font:400 38px "Ma Shan Zheng","Kaiti SC","STKaiti",serif;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.stele button.lit{background:var(--gold);color:#fff}
.stele button.bad{background:var(--cinnabar);color:#fff}
.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink)}
.dots i.on{background:var(--cinnabar);border-color:var(--cinnabar)}
.thunder{font-size:44px;letter-spacing:6px;color:var(--spirit);min-height:56px}
.crack{animation:crack .7s ease-out}
@keyframes crack{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.1) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
.reveal{font-size:18px;margin-top:14px;min-height:28px}

@media (max-width:560px){
  .cards{grid-template-columns:1fr;gap:9px}
  .card{flex-direction:row;min-height:0;text-align:left;padding:13px 16px;gap:14px}
  .card .glyph{font-size:40px;flex:none;width:46px;text-align:center}
  .slots{grid-template-columns:repeat(2,1fr)}
  .book{width:40px;height:150px;font-size:13px}
  .stele{grid-template-columns:repeat(3,64px)} .stele button{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){#banner.show{animation-duration:2.2s}.card{transition:none}.mapsvg .node.open circle{animation:none}.crack{animation:none}}
/* 山海纪 · offline visual system */
:root,:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#091c21;--ink:#e9e5cf;--jade:#89d5b2;--gold:#d7b876;--cinnabar:#da8065;--spirit:#8ac9dd;--stone:#a4aeaa;--violet:#b4a0df;--rose:#eba6b5;--panel:rgba(16,39,43,.96);--panel2:rgba(28,53,53,.88);--line:rgba(206,184,129,.24);--veil:rgba(4,18,23,.86);--wood:#66523b}

/* ========== 音效 ========== */
const SFX = { ctx:null, master:null, bgmGain:null, noise:null, last:{}, pickN:0 };
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
function audioInit(){
  if (SFX.ctx){ if (SFX.ctx.state === 'suspended') SFX.ctx.resume(); return; }
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const c = SFX.ctx = new A();
    SFX.master = c.createGain(); SFX.master.connect(c.destination);
    SFX.bgmGain = c.createGain(); SFX.bgmGain.gain.value = 0.4; SFX.bgmGain.connect(SFX.master);
    const b = c.createBuffer(1, c.sampleRate * 0.6, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    SFX.noise = b; applyMute();
  } catch (e) { SFX.ctx = null; }

function applyMute(){ if (SFX.master) SFX.master.gain.value = META.muted ? 0 : 0.5; $('muteBtn').textContent = META.muted ? '✕' : '♪'; }
function tone(f, dur, o = {}){
  const c = SFX.ctx, t = o.at || c.currentTime, osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * o.slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(o.dest || SFX.master); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f, f2, at){
  const c = SFX.ctx, t = at || c.currentTime, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SFX.noise; fl.type = ftype; fl.frequency.setValueAtTime(f, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(SFX.master); s.start(t); s.stop(t + dur);
}
const GAP = { qin:0.15, bell:0.2, coin:0.05, hit:0.05, pick:0.035, kill:0.06, sword:0.07, fire:0.1, boom:0.09, thunder:0.1, shoot:0.15, punch:0.08, arrow:0.08, ice:0.12, wind:0.15, slam:0.12, swing:0.12, heal:0.3, stone:0.05 };
function sfx(name){
  if (!SFX.ctx || META.muted || !META.sfx) return;
  const now = SFX.ctx.currentTime;
  if (GAP[name] && now - (SFX.last[name] || 0) < GAP[name]) return;
  SFX.last[name] = now;
  switch (name){
    case 'hit': noise(0.05, 0.1, 'bandpass', 1800); break;
    case 'kill': tone(rand(420, 620), 0.09, { type:'triangle', vol:0.07, slide:0.5 }); break;
    case 'pick': SFX.pickN = (SFX.pickN + 1) % PENTA.length; tone(PENTA[SFX.pickN], 0.08, { vol:0.06 }); break;
    case 'stone': tone(1760, 0.06, { type:'triangle', vol:0.05 }); tone(2349, 0.08, { vol:0.04, at:now + 0.04 }); break;
    case 'sword': noise(0.14, 0.12, 'bandpass', 4000, 900); break;
    case 'punch': noise(0.08, 0.2, 'lowpass', 900, 200); tone(110, 0.1, { vol:0.15, slide:0.5 }); break;
    case 'swing': noise(0.25, 0.12, 'bandpass', 600, 2400); break;
    case 'arrow': tone(1200, 0.06, { type:'triangle', vol:0.05, slide:0.4 }); break;
    case 'ice': [0, 0.03].forEach(d => tone(2637 - d * 3000, 0.15, { vol:0.04, at:now + d })); break;
    case 'wind': noise(0.4, 0.08, 'bandpass', 500, 1500); break;
    case 'slam': tone(60, 0.4, { vol:0.3, slide:0.5 }); noise(0.3, 0.2, 'lowpass', 800, 80); break;
    case 'heal': [4, 7].forEach((n, i) => tone(PENTA[n], 0.4, { vol:0.05, at:now + i * 0.08 })); break;
    case 'fire': tone(330, 0.12, { type:'triangle', vol:0.06, slide:1.6 }); break;
    case 'boom': noise(0.3, 0.22, 'lowpass', 1400, 120); break;
    case 'thunder': noise(0.45, 0.3, 'lowpass', 4000, 150); tone(70, 0.3, { type:'square', vol:0.07, slide:0.6 }); break;
    case 'hurt': tone(170, 0.2, { type:'square', vol:0.12, slide:0.45 }); break;

    case 'evo': [0,2,4,5,7,9].forEach((n, i) => { tone(PENTA[n], 0.7, { type:'triangle', vol:0.1, at:now + i * 0.06 }); tone(PENTA[n] * 2, 0.5, { vol:0.04, at:now + i * 0.06 }); }); break;
    case 'boss': tone(98, 3, { vol:0.28, slide:0.92, attack:0.01 }); tone(98 * 2.76, 2, { vol:0.1 }); tone(98 * 5.4, 1.2, { vol:0.05 }); noise(0.5, 0.15, 'lowpass', 300); break;
    case 'drum': [0, 0.18, 0.36].forEach(d => { tone(90, 0.25, { vol:0.25, slide:0.5, at:now + d }); noise(0.08, 0.08, 'lowpass', 500, 0, now + d); }); break;
    case 'chest': [4,5,7,9].forEach((n, i) => tone(PENTA[n], 0.3, { vol:0.08, at:now + i * 0.05 })); break;
    case 'event': [2,4,7].forEach((n, i) => tone(PENTA[n] * 0.5, 0.9, { type:'triangle', vol:0.1, at:now + i * 0.12 })); break;
    case 'win': [0,2,4,7,9].forEach((n, i) => tone(PENTA[n] * 0.5, 1.4, { type:'triangle', vol:0.12, at:now + i * 0.18 })); break;
    case 'lose': [7,5,4,2,0].forEach((n, i) => tone(PENTA[n] * 0.25, 1.2, { type:'triangle', vol:0.12, at:now + i * 0.22 })); break;
    case 'qin': { const base = [196, 220, 261.63, 293.66, 329.63][Math.floor(Math.random() * 5)]; [1, 1.5, 2].forEach((m, i) => tone(base * m, 1.1, { type:'triangle', vol:0.07, at:now + i * 0.03, slide:0.995, attack:0.003 })); break; }
    case 'bell': tone(1318.5, 0.9, { vol:0.06 }); tone(1318.5 * 2.76, 0.5, { vol:0.025 }); break;

const CAT_NAME = { w:'法宝', g:'功法', p:'心法' };
const ACTIVE = Object.keys(SK).filter(k => SK[k].cat !== 'p');
const MAX_ACTIVE = 6, MAX_PASSIVE = 6;

/* —— 飞剑细节 —— */
function syncSwords(){
  if (!P.sk.sword){ swords = []; return; }
  const n = S('sword').n;
  while (swords.length < n) swords.push({ st:'orbit', x:P.x, y:P.y, vx:0, vy:0, life:0, pl:0, hits:new Set(), ang:0 });
}
function orbitPos(i, n, r){ const a = time * 2.6 + i * Math.PI * 2 / n; return { x:P.x + Math.cos(a) * r, y:P.y + Math.sin(a) * r, a }; }
function launch(w, t, s){
  const dx = t.x - w.x, dy = t.y - w.y, d = Math.hypot(dx, dy) || 1;
  w.st = 'fly'; w.vx = dx / d * 680; w.vy = dy / d * 680; w.life = 0.75; w.pl = s.pierce; w.hits.clear();
}
function updSwords(dt){

function separate(){

/* ========== 投射物、天降、召唤 ========== */
function updProjs(dt){
  for (const p of projs){
    if (p.k === 'wind'){ p.rad += p.vr * dt; p.ang += p.va * dt; p.x = P.x + Math.cos(p.ang) * p.rad; p.y = P.y + Math.sin(p.ang) * p.rad; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; }
    p.life -= dt; p.spin += dt * 8;
    if (p.life <= 0){ p.dead = true; if (p.boom) explode(p.x, p.y, p.boom, p.dmg, p.cat, p.burn, p.eff); continue; }
    for (const e of enemies){
      if (e.dead || p.hits.has(e)) continue;
      if (d2(p, e) < (e.r + p.r) ** 2){
        if (p.boom){ p.dead = true; explode(p.x, p.y, p.boom, p.dmg, p.cat, p.burn, p.eff); break; }
        p.hits.add(e); hit(e, p.dmg, p.x, p.y, p.kb, p.cat, p.eff);
        if (--p.pierce <= 0){ p.dead = true; break; }
      }
    }
  }
  projs = projs.filter(p => !p.dead);
  for (const s of strikes){
    s.t += dt;
    if (s.t >= s.delay){
      s.dead = true;
      aoe(s.x, s.y, s.r, s.dmg, 120, s.cat, s.stun ? { stun:s.stun } : null);
      fx.push({ k:s.k === 'seal' ? 'slam' : 'boom', x:s.x, y:s.y, r:s.r, t:0, dur:0.4 });
      shake = Math.max(shake, s.k === 'seal' ? 8 : 4); sfx(s.k === 'seal' ? 'slam' : 'boom');
      if (s.burn && zones.length < 30) zones.push({ x:s.x, y:s.y, r:s.r * 0.9, t:0, dur:3, tick:0, dmg:s.dmg * 0.25 });
    }
  }
  strikes = strikes.filter(s => !s.dead);

function updAllies(dt){
  const bs = P.sk.banner ? S('banner') : null, ng = bs ? bs.n : 0;
  const ps = P.sk.beast ? S('beast') : null, np = ps ? ps.n : 0;
  for (const [k, n] of [['ghost', ng], ['pet', np]]){
    let cur = allies.filter(a => a.k === k);
    if (cur.length > n){ allies = allies.filter(a => a.k !== k); cur = []; }
    while (cur.length < n){ const a = { k, x:P.x + rand(-20, 20), y:P.y + rand(-20, 20), cd:0, wob:Math.random() * 6 }; allies.push(a); cur.push(a); }
  }
  for (const a of allies){
    const ghost = a.k === 'ghost', crow = !ghost && P.beastType === 'crow';
    const dmg = ghost ? bs.dmg : ps.dmg * P.st.petMul * (P.beastType === 'wolf' ? 1.3 : 1), spd = ghost ? bs.spd : ps.spd;
    a.cd -= dt;
    let t = a.tgt;
    if (!t || t.dead || d2(t, P) > 420 * 420) t = a.tgt = nearest(a.x, a.y, 320);
    let tx, ty;
    if (t){ tx = t.x; ty = t.y; } else { const ang = time * 1.5 + a.wob; tx = P.x + Math.cos(ang) * 50; ty = P.y + Math.sin(ang) * 50; }
    const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy) || 1;

}
function updOrbs(dt){

/* ========== 主更新 ========== */
function update(dt){
  time += dt; STAGE.t += dt;
  const v = inputVec(), sp = P.st.speed * (P.slowT > 0 ? 0.6 : 1);
  P.x += v.x * sp * dt; P.y += v.y * sp * dt;
  if (v.x || v.y){ P.walk += dt; P.faceA = Math.atan2(v.y, v.x); }
  P.inv = Math.max(0, P.inv - dt); P.slowT -= dt; P.atkT -= dt;
  if (!P.st.noRegen) P.hp = Math.min(P.st.maxHp, P.hp + P.st.regen * P.st.healMul * dt);
  shake = Math.max(0, shake - dt * 30);
  updStage(dt); if (state !== 'play') return;
  updEnemies(dt); separate(); updBullets(dt);
  if (state === 'play') updWeapon(dt);
  for (const k of Object.keys(P.sk)){ const s = SK[k]; if (s.upd && state === 'play' && (!isPureSummoner() || s.summon)) s.upd(dt, S(k)); }
  if (!P.sk.drain) beams = [];
  updAllies(dt); updProjs(dt); updWaves(dt); updOrbs(dt); updFx(dt); updWeather(dt);
  enemies = enemies.filter(e => !e.dead || e.boss || e.guardian);
  enemies = enemies.filter(e => !e.dead);
  if (state !== 'play') return;
  updMarks(dt);
  if (state !== 'play') return;
  hud();
  if (pendingLv > 0) openLevelUp();
}

let weather = [];
function initWeather(){ weather = []; for (let i = 0; i < 45; i++) weather.push(newParticle(true)); }
function newParticle(init){
  const sc = P ? P.scene : 'bamboo';
  const p = { x:rand(0, W), y:init ? rand(0, H) : -10, a:rand(0, 6), s:rand(0.6, 1.2) };
  if (sc === 'desert'){ p.x = init ? rand(0, W) : -20; p.y = rand(0, H); }

}
function updWeather(dt){
  const sc = P ? P.scene : 'bamboo';

    const p = weather[i];

  }
}

      c.globalAlpha = 0.45; c.fillStyle = C.jade; c.save(); c.translate(p.x, p.y); c.rotate(p.a);

function drawGround(cx, cy, sceneK){

  const x0 = Math.floor(cx / g) - 1, y0 = Math.floor(cy / g) - 1, x1 = Math.ceil((cx + W) / g) + 1, y1 = Math.ceil((cy + H) / g) + 2;

  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++){
    const h = hash(i, j), h2 = hash(j + 7, i - 3), x = i * g + h * 70, y = j * g + h2 * 70;

let lvReturn = null;
function rollOptions(){
  const opts = [];
  for (const k of ACTIVE){ const ev = SK[k].evo; if (P.sk[k] === SK[k].max && !P.evo[k] && P.sk[ev.pair]) opts.push('evo:' + k); }
  opts.splice(3);
  const fav = SECTS[P.sect].fav, pool = Object.keys(SK).filter(k => canTake(k));
  while (opts.length < 3 && pool.length){
    const w = pool.map(k => {
      let x = (P.sk[k] ? 2.2 : 1) * (fav.includes(k) ? 1.6 : 1);
      if (SK[k].cat === 'p' && ACTIVE.some(a => P.sk[a] && SK[a].evo.pair === k)) x *= 1.4;
      return x;
    });
    let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
    while (i < w.length - 1 && r > w[i]){ r -= w[i]; i++; }
    opts.push(pool.splice(i, 1)[0]);

}

function showMap(){
  state = 'map'; $('hud').hidden = true; $('boss').hidden = true; P.scene = CHAPTERS[RUN.ch].scene; initWeather();
  const rows = RUN.map.rows, R = rows.length, VH = R * 16 + 8, open = openNodes().map(n => n.id);
  const pos = (n) => [10 + n.x * 80, VH - 8 - n.r * 16];
  const walked = new Set(); for (let i = 1; i < RUN.path.length; i++) walked.add(RUN.path[i - 1] + '>' + RUN.path[i]);
  let edges = '', nodes = '';
  for (const row of rows) for (const n of row){
    const [x1, y1] = pos(n);
    for (const id of n.next){ const m = nodeById(id), [x2, y2] = pos(m); edges += `<line class="edge${walked.has(n.id + '>' + id) ? ' walked' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    const cls = ['node', 't-' + n.type, RUN.path.includes(n.id) ? 'done' : '', RUN.pos === n.id ? 'here' : '', open.includes(n.id) ? 'open' : ''].join(' ');
    const r = n.type === 'boss' ? 6.5 : 5;
    nodes += `<g class="${cls}" ${open.includes(n.id) ? `data-act="node" data-k="${n.id}" tabindex="0" role="button" aria-label="${NODE[n.type].n}"` : ''}><circle cx="${x1}" cy="${y1}" r="${r}"/><text x="${x1}" y="${y1 + 0.3}"${n.type === 'boss' ? ' style="font-size:7px"' : ''}>${NODE[n.type].g}</text></g>`;
  }
  const C0 = CHAPTERS[RUN.ch];
  showOverlay(`<div class="panel">
    <h2>${C0.title}　${C0.name}</h2>
    <div class="maphead"><span class="kai" style="font-size:20px">${realmName(P.lvl)}</span><span>气血 <b>${Math.ceil(P.hp)}/${P.st.maxHp}</b></span><span>灵石 <b>${P.stones}</b></span><span>机缘 <b>${P.st.luck}</b></span>${RUN.jie ? `<span>劫数 <b>${RUN.jie}</b></span>` : ''}</div>
    <div class="actions" style="margin-top:12px">${btn('bag', '行囊', null, 'ghost sm')}<button class="btn ghost sm" data-act="attr">加点${P.attrPts ? `<span class="badge">${P.attrPts}</span>` : ''}</button>${btn('skills', '功法', null, 'ghost sm')}${btn('leave', '暂离', null, 'ghost sm')}</div>
    <div class="mapwrap"><svg class="mapsvg" viewBox="0 0 100 ${VH}" role="img" aria-label="路线图">${edges}${nodes}</svg></div>
    <div class="legend">${Object.keys(NODE).map(k => `<span><b class="kai">${NODE[k].g}</b> ${NODE[k].n}</span>`).join('')}</div>
    <p class="help">选择一个闪烁的节点前进。</p></div>`);
}
function enterNode(id){
  const n = nodeById(id); if (!n || !openNodes().some(m => m.id === id)) return;
  sfx('click');
  if (['combat', 'elite', 'boss'].includes(n.type)) return startStage(n);
  if (n.type === 'shop') return openShop(n);
  if (n.type === 'rest') return openRest(n);
  if (n.type === 'treasure') return openTreasure(n);
  if (n.type === 'event') return Math.random() < 0.3 ? openQuickEvent(() => completeNode(n.id)) : openMev(n);
}

function bagAct(a, k){
  if (a === 'selEq'){ bagSel = { eq:k }; }
  else if (a === 'selBag'){ bagSel = { uid:k }; }
  else if (a === 'equip'){
    const i = P.bag.findIndex(x => x.uid === bagSel.uid); if (i < 0) return;
    const it = P.bag[i], old = P.eq[it.slot]; P.eq[it.slot] = it; P.bag.splice(i, 1); if (old) P.bag.push(old);
    recalc(); sfx('equip'); bagSel = { eq:it.slot };
  } else if (a === 'unequip'){
    const it = P.eq[bagSel.eq]; if (!it || P.bag.length >= 16) return;
    if (it.slot === 'weapon'){ banner('兵器不可空手'); return; }
    P.eq[bagSel.eq] = null; P.bag.push(it); recalc(); bagSel = null;
  } else if (a === 'sell'){
    const i = P.bag.findIndex(x => x.uid === bagSel.uid); if (i < 0) return;
    P.stones += itemValue(P.bag[i]); P.bag.splice(i, 1); bagSel = null; sfx('coin');
  } else if (a === 'forge'){
    const it = P.eq[bagSel.eq]; if (!it || it.lvl >= 5) return;
    it.lvl++; recalc(); sfx('slam'); bagForge = false; bagSel = null;
    const back = bagBack; bagBack = null; return back && back(`「${it.name}」强化至 +${it.lvl}`);
  }
  showBag(null, bagForge);
}

  const g = SHOP.goods[i]; if (!g || g.sold || P.stones < g.price) return;

function gameOver(win){

  if (win){ META.wins++; if (RUN.jie >= META.maxJie && META.maxJie < 5) META.maxJie++; }

const backToMap = () => showMap();
overlay.addEventListener('click', e => {
  audioInit();
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (a !== 'mev' && a !== 'lv') sfx('click');
  switch (a){
    case 'lv': return choose(+k);
    case 'reroll': if (P.rerolls > 0){ P.rerolls--; curOpts = rollOptions(); renderLevelUp(); } return;
    case 'evopt': return chooseEvent(+k);
    case 'evdone': return eventDone();
    case 'bj': return doBingjie(k);
    case 'die': state = 'play'; return gameOver(false);
    case 'continue': if (loadRun()) showMap(); else showTitle(); return;
    case 'setup': return showSetup();
    case 'ssect': setupSel.sect = k; return showSetup();
    case 'sjie': setupSel.jie = +k; return showSetup();
    case 'begin': return beginRun();
    case 'meta': return showMeta();
    case 'title': return showTitle();
    case 'map': return showMap();
    case 'node': return enterNode(k);
    case 'leave': saveRun(); return showTitle();
    case 'bag': bagSel = null; return showBag(state === 'shop' ? () => renderShop() : backToMap);
    case 'selEq': case 'selBag': case 'equip': case 'unequip': case 'sell': case 'forge': return bagAct(a, k);
    case 'bagback': { const f = bagBack; bagBack = null; bagForge = false; return f ? f() : showMap(); }
    case 'attr': return showAttr(backToMap);
    case 'skills': return showSkills(backToMap);
    case 'addattr': if (P.attrPts > 0){ P.attrPts--; P.attr[k] = (P.attr[k] || 0) + 1; recalc(); } return showAttr();
    case 'attrback': { const f = attrBack; attrBack = null; return f ? f() : showMap(); }
    case 'pskills': return showSkills(() => { state = 'play'; pause(); state = 'pause'; });
    case 'resume': overlay.hidden = true; state = 'play'; return;
    case 'quit': return gameOver(false);
    case 'rwpick': return rwPick(+k);
    case 'tonode': return completeNode(STAGE.node);
    case 'buy': if (state === 'shop') return shopBuy(+k);
      { const c = upCost(k); if (META.pts >= c && upLv(k) < UPS[k].max){ META.pts -= c; META.up[k] = upLv(k) + 1; saveMeta(); sfx('chest'); showMeta(); } } return;
    case 'usect': { const c = SECTS[k].cost; if (META.pts >= c && !META.sects[k]){ META.pts -= c; META.sects[k] = true; saveMeta(); sfx('evo'); showMeta(); } } return;
    case 'reroll-shop': if (P.stones >= SHOP.reroll){ P.stones -= SHOP.reroll; SHOP.reroll += 10; SHOP.goods = shopGoods(); renderShop(); } return;
    case 'leave-node': return completeNode(SHOP.node);
    case 'rest-heal': heal(P.st.maxHp * 0.4); return restDone(`你盘膝调息，伤势好了大半。气血 ${Math.ceil(P.hp)}/${P.st.maxHp}。`);
    case 'rest-medit': P.attrPts += 2; return restDone('闭关数日，你对大道又有了新的领悟。属性点 +2。');
    case 'rest-forge': bagSel = null; return showBag(t => restDone(t || '你放下了炉锤。'), true);
    case 'tonode-rest': return completeNode(REST.node);
    case 'trea': { const it = TREA.items[+k]; banner(RAR[it.rar] + '·' + it.name); addToBag(it); sfx('equip'); return completeNode(TREA.node); }
    case 'mev': if (MEV) MEV.act(k, b); return;
    case 'mevnext': return completeNode(k);
    case 'tsfx': case 'tbgm': { const key = a === 'tsfx' ? 'sfx' : 'bgm'; META[key] = !META[key]; saveMeta(); b.setAttribute('aria-pressed', META[key]); } return;
  }
});
overlay.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles:true })); } });
$('pauseBtn').addEventListener('click', pause);
$('muteBtn').addEventListener('click', () => { audioInit(); META.muted = !META.muted; saveMeta(); applyMute(); });
function onKey(e){
  if (e.repeat) return;
  const digit = /^Digit[1-9]$/.test(e.code) ? +e.code.slice(5) - 1 : -1;
  if (state === 'levelup' && digit >= 0 && digit < 3){ choose(digit); e.preventDefault(); }
  else if (state === 'levelup' && e.code === 'KeyR' && P.rerolls > 0){ P.rerolls--; curOpts = rollOptions(); renderLevelUp(); }
  else if (state === 'event' && curEvent && digit >= 0) chooseEvent(digit);
  else if (state === 'mev' && MEV && MEV.phase === 'brew' && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); MEV.act('stop'); }
  else if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') pause();
  else if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'pause'){ overlay.hidden = true; state = 'play'; }
  if (state === 'play' && e.code.startsWith('Arrow')) e.preventDefault();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  else { if (!STAGE || MENU_STATES.includes(state)) updWeather(dt); if (MEV && MEV.tick) MEV.tick(dt); }
  draw();
  requestAnimationFrame(frame);
}

/* —— 职业限制：升级、奇遇、坊市秘籍都只出本职业的技能 —— */
const _canTake0 = canTake;
canTake = function(k){
  const c = CLS(), s = SK[k];
  if (c && s && !P.sk[k]){
    if (s.cat !== 'p' && !c.pool.includes(k)) return false;
    if (s.cat === 'p' && CLASS_ONLY_PASSIVES.has(k) && !(c.passives || []).includes(k)) return false;
  }
  return _canTake0(k);
};

/* —— 属性：主修基础、本命兵器加成、副业 —— */
function phase1Stats(){
  const o = {}, add = s => { for (const k in s) o[k] = (o[k] || 0) + s[k]; };
  const c = CLS(); if (c){ add(c.st); if (isMatch()) add(c.matchSt); }
  const p = P && PROFS[P.prof]; if (p) add(p.st);
  return o;
}
const _recalc1 = recalc;
recalc = function(){
  if (!P) return _recalc1();
  const extra = phase1Stats(), orig = P.bonus, merged = Object.assign({}, orig);
  for (const k in extra) merged[k] = (merged[k] || 0) + extra[k];
  P.bonus = merged;
  try { _recalc1(); } finally { P.bonus = orig; }
};

const _newRun1 = newRun;
newRun = function(sectK, jie){
  _newRun1(sectK, jie);
  const ck = CLASSES[setupSel.cls] ? setupSel.cls : SECT_DEFAULT_CLS[sectK] || 'jian', c = CLASSES[ck];
  P.cls = ck; P.prof = PROFS[setupSel.prof] ? setupSel.prof : 'alchemist';
  P.sk = {}; P.sk[c.start] = 1;
  P.eq.weapon = genItem('weapon', 0, 0, c.weapon);
  P.farm = 0; P.shield = 0;
  recalc(); P.hp = P.st.maxHp;
};

function assault(){const s=STAGE;if(!s||s.done)return;s.wave++;s.assaultCount=(s.assaultCount||0)+1;s.assaultKills=s.kills;
  const count=Math.min(44,14+s.wave*4+s.ch*4),R=Math.min(W,H)/2+100;for(let i=0;i<count;i++){const a=i/count*Math.PI*2;spawn(s.wave>=3?'fast':'chase',P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);}
  if(s.wave>=2)spawn('elite');s.nextWave=s.clock+(s.fast?22:40);s.rushReady=s.clock+8;banner(`第 ${s.wave} 波兽潮 · 迎战`);sfx('drum');}
function summonFinal(){const s=STAGE;if(s.obj==='boss'&&!s.boss){s.boss=spawn('boss');banner(s.boss.name+'现身');sfx('boss');}
  else if(s.obj==='elite'&&!s.guardian){s.guardian=spawn('elite',undefined,undefined,{r:30,afxN:Math.min(3,2+s.ch),guardian:true});s.guardian.hp*=s.ch?3.5:2.6;s.guardian.maxHp=s.guardian.hp;s.guardian.name='镇守·'+s.guardian.name;banner(s.guardian.name+'现身');sfx('boss');}}
function rush(){if(state!=='play'||!STAGE||STAGE.done)return;const s=STAGE;if(s.clock<s.rushReady)return toast('鸣钟尚未冷却。');

const baseUpdStage=updStage;
updStage=function(dt){const s=STAGE;s.clock=(s.clock||0)+dt;s.nextWave??=40;s.assaultCount??=0;s.rushReady??=0;s.assaultKills??=0;
  const controlled=['survive','guard'].includes(s.obj),final=['elite','boss'].includes(s.obj);
  if(!s.done){
    if(final&&!s.boss&&!s.guardian&&s.clock>=(s.fast?12:s.obj==='boss'?150:120))summonFinal();
    if(!final&&s.clock>=s.nextWave&&(!controlled||!s.fast||s.assaultCount<3))assault();
  }
  // The original clock drives continuous spawning; suppress only its periodic wave and delayed boss logic.
  const realT=s.t,oldDur=s.dur,oldObj=s.obj;
  let complete=false;
  if(controlled&&s.assaultCount>=3)complete=s.kills-s.assaultKills>=Math.round(18+6*s.ch)&&!enemies.some(e=>!e.dead&&e.elite);
  if(controlled&&s.fast&&!complete)s.dur=Infinity;
  if(controlled&&complete)s.dur=0;
  // Offset exact 40s boundaries so baseUpdStage doesn't duplicate the manually scheduled wave.
  if(Math.floor(s.t/40)!==Math.floor((s.t-dt)/40)&&s.t>5)s.t+=dt;
  if(final&&!s.boss&&!s.guardian)s.t=Math.min(s.t,119);
  baseUpdStage(dt);s.t=realT;s.dur=oldDur;s.obj=oldObj;
};

function grantEncounter(e,mult=1){const n=e.amount*mult;let text='';switch(e.reward){case'attr':P.attrPts+=Math.max(1,Math.round(n));text=`属性点 +${Math.max(1,Math.round(n))}`;break;case'heal':heal(P.st.maxHp*Math.min(1,n));text=`回复 ${Math.round(Math.min(1,n)*100)}% 气血`;break;case'item':text=addToBag(genItem(null,Math.min(4,e.amount+Math.floor(mult-1)),RUN.ch));break;case'xp':gainXp(P.xpNext*.65);text='获得大量修为';break;case'stones':P.stones+=Math.round(n*(RUN.ch+1));text=`灵石 +${Math.round(n*(RUN.ch+1))}`;break;default:bonus(e.reward,n);text=e.reward==='hp'?`气血上限 +${Math.round(n)}`:e.reward==='luck'?`机缘 +${n}`:`${{wdmg:'兵器伤害',gdmg:'功法伤害',armor:'减伤',spd:'移速'}[e.reward]} +${Math.round(n*100)}%`;}
  return text;
}
function openAtlasEvent(node){
  const candidates=ATLAS_EVENTS.filter(e=>e.ch===RUN.ch),seen=new Set(P.journal||[]);let e=candidates.find(e=>e.id===node.eventId&&!seen.has(e.id))||pick(candidates.filter(e=>!seen.has(e.id)).length?candidates.filter(e=>!seen.has(e.id)):candidates);
  state='mev';MEV={node:node.id,event:e,phase:'intro',step:0,mistakes:0,energy:randi(18,32),moves:0,score:0,seq:[],picked:[],target:0,cells:[],path:[6],time:0,needle:0,done:false,act(k){atlasAct(k);},tick(dt){if(state!=='mev'||this.done)return;this.time+=dt;if(this.phase==='watch'&&this.time>3){this.phase='solve';this.time=0;renderEncounter();}if(this.phase==='timing'){this.needle=(Math.sin(this.time*2.4)+1)/2;const bar=$('atlas-needle');if(bar)bar.style.left=(this.needle*100)+'%';}}};
  renderEncounter();
}
function renderEncounter(){const m=MEV;if(!m||!m.event)return;const e=m.event;let body='';const buttons=(labels)=>`<div class="actions">${labels.map(([k,t])=>btn('mev',t,k,'ghost')).join('')}</div>`;

  else switch(e.mode){
    case'sequence':{const symbols=e.symbols.split(',');body=m.phase==='watch'?`<p class="sub">记住顺序：${m.seq.map(i=>symbols[i]).join(' → ')}</p><p class="help">3 秒后开始作答</p>`:`<p class="sub">已奏 ${m.step}/${m.seq.length} · 可错 ${2-m.mistakes} 次</p><div class="puzzle-grid">${symbols.map((s,i)=>btn('mev',s,'cell:'+i,'ghost')).join('')}</div>`;break;}
    case'memory':body=`<p class="sub">${m.phase==='watch'?'记住金色格子，3 秒后翻面':`已找到 ${m.score}/3 · 失误 ${m.mistakes}/2`}</p><div class="puzzle-grid">${Array.from({length:9},(_,i)=>`<button data-act="mev" data-k="cell:${i}" ${m.phase==='watch'||m.picked.includes(i)?'disabled':''} class="${(m.phase==='watch'&&m.seq.includes(i))||m.picked.includes(i)?'lit':''}">${m.phase==='watch'&&m.seq.includes(i)?e.symbols.split(',')[m.seq.indexOf(i)]||'真':m.picked.includes(i)?'✓':'？'}</button>`).join('')}</div>`;break;
    case'pipes':body=`<p class="sub">${m.cells.filter(Boolean).length}/9 已亮 · ${18-m.moves} 步可用</p><div class="puzzle-grid">${m.cells.map((v,i)=>`<button data-act="mev" data-k="cell:${i}" class="${v?'lit':''}">${v?'✦':'·'}</button>`).join('')}</div>`;break;
    case'route':body=`<p class="sub">沿亮格移动 · 当前位置 ${m.path.at(-1)+1}</p><div class="puzzle-grid">${Array.from({length:9},(_,i)=>`<button data-act="mev" data-k="cell:${i}" class="${m.seq.includes(i)?'lit':''}">${m.path.at(-1)===i?'你':i===2?'终':m.seq.includes(i)?'·':'山'}</button>`).join('')}</div>`;break;
    case'riddle':body=`<div class="vlist">${m.answers.map((a,i)=>btn('mev',a.text,'answer:'+i,'ghost')).join('')}</div>`;break;
    case'balance':body=`<p class="sub">${m.energy} / 100 · 目标 45～55 · 剩余 ${5-m.moves} 步</p><div class="event-progress"><i style="width:${m.energy}%"></i></div>${buttons([['adjust:-13','缓吐 −13'],['adjust:9','轻纳 +9'],['adjust:21','深纳 +21'],['settle','收功']])}`;break;
    case'choice':body=`<div class="vlist">${e.symbols.split('|').map((t,i)=>btn('mev',t,'choice:'+i,'ghost',i===0&&P.stones<20)).join('')}</div>`;break;
    case'catch':body=`<p class="sub">捕获 ${m.score}/5 · 失误 ${m.mistakes}/3</p><div class="puzzle-grid">${Array.from({length:9},(_,i)=>`<button data-act="mev" data-k="cell:${i}" class="${i===m.target?'lit':''}">${i===m.target?e.symbols:'·'}</button>`).join('')}</div>`;break;
    case'timing':body=`<div class="gauge"><span class="zg" style="left:35%;width:30%"></span><span class="zp" style="left:43%;width:14%"></span><span id="atlas-needle" class="needle"></span></div><p class="help">绿色范围可成，金色范围收获更佳 · 剩余 ${3-m.mistakes} 次</p>${buttons([['stop','此刻出手']])}`;break;
    case'trade':body=`<p class="sub">现有灵石 ${P.stones}</p><div class="vlist">${e.symbols.split('|').map((t,i)=>btn('mev',t+[' · 回复 45% 气血',' · 属性点 +2',' · 获得稀有装备'][i],'trade:'+i,'ghost',P.stones<[15,35,55][i])).join('')}</div>`;break;
    case'risk':body=`<p class="sub">已获得 ${m.score} 份收获 · 下次成功率 ${Math.round(Math.max(.25,.95-m.score*.15)*100)}%</p><div class="actions">${btn('mev','再前进一步','risk','red')}${btn('mev','收手带走','bank','ghost',m.score===0)}</div>`;break;

function encounterResult(success,text='',mult=1){const m=MEV;if(!m||m.done)return;m.done=true;m.phase='result';P.journal=P.journal||[];if(!P.journal.includes(m.event.id))P.journal.push(m.event.id);m.result=(success?m.event.ending+' '+grantEncounter(m.event,mult):text||'这一次机缘未成。你收拾心情，继续前行。');sfx(success?'chest':'fail');renderEncounter();}
function flipCell(a,i){for(const j of [i,i-3,i+3,i%3>0?i-1:-1,i%3<2?i+1:-1])if(j>=0&&j<9)a[j]=!a[j];}
function atlasAct(k){const m=MEV;if(!m||!m.event||m.done)return;const e=m.event;
  if(k==='leave')return encounterResult(false,'你记下此地风物，决定继续赶路。');
  if(k==='start'){
    m.time=0;m.phase='solve';if(e.mode==='sequence'){m.seq=Array.from({length:e.ch===0&&e.id.endsWith('_0')?3:4},()=>randi(0,5));m.phase='watch';}
    if(e.mode==='memory'){m.seq=shuffle([0,1,2,3,4,5,6,7,8]).slice(0,3);m.phase='watch';}
    if(e.mode==='pipes'){m.cells=Array(9).fill(true);for(const i of shuffle([0,1,2,3,4,5,6,7,8]).slice(0,4))flipCell(m.cells,i);}
    if(e.mode==='route')m.seq=pick([[6,3,4,1,2],[6,7,4,5,2],[6,3,0,1,2]]);
    if(e.mode==='riddle')m.answers=shuffle(e.symbols.split('|').map((text,i)=>({text,correct:i===0})));
    if(e.mode==='catch')m.target=randi(0,8);if(e.mode==='timing')m.phase='timing';return renderEncounter();
  }
  if(m.phase==='watch')return;
  if(k.startsWith('cell:')){const i=+k.slice(5);if(!Number.isInteger(i)||i<0||i>8)return;
    if(e.mode==='sequence'){if(i===m.seq[m.step]){m.step++;sfx('pick');if(m.step===m.seq.length)return encounterResult(true);}else if(++m.mistakes>=2)return encounterResult(false);}
    if(e.mode==='memory'){if(m.picked.includes(i))return;if(m.seq.includes(i)){m.picked.push(i);m.score++;if(m.score===3)return encounterResult(true);}else if(++m.mistakes>=2)return encounterResult(false);}
    if(e.mode==='pipes'){flipCell(m.cells,i);m.moves++;if(m.cells.every(Boolean))return encounterResult(true);if(m.moves>=18)return encounterResult(false);}
    if(e.mode==='route'){const current=m.path.at(-1),adj=Math.abs(Math.floor(current/3)-Math.floor(i/3))+Math.abs(current%3-i%3)===1;if(!adj||!m.seq.includes(i))return toast('只能移动到相邻的亮格。');m.path.push(i);if(i===2)return encounterResult(true);}
    if(e.mode==='catch'){if(i===m.target){if(++m.score===5)return encounterResult(true);m.target=(m.target+randi(1,8))%9;sfx('pick');}else if(++m.mistakes>=3)return encounterResult(false);}
  }else if(k.startsWith('answer:'))return encounterResult(!!m.answers[+k.slice(7)]?.correct);
  else if(k.startsWith('adjust:')){if(m.moves>=5)return;const d=+k.slice(7);if(![-13,9,21].includes(d))return;m.energy=Math.max(0,Math.min(100,m.energy+d));m.moves++;if(m.energy>=45&&m.energy<=55)return encounterResult(true);if(m.moves>=5)return encounterResult(false);}
  else if(k==='settle')return encounterResult(m.energy>=45&&m.energy<=55);
  else if(k.startsWith('choice:')){const i=+k.slice(7);if(i===0){if(P.stones<20)return;P.stones-=20;}else if(i===1)hpCost(P.st.maxHp*.1);return encounterResult(true,'',i===2?.5:1);}
  else if(k==='stop'&&e.mode==='timing'){if(m.needle>=.35&&m.needle<=.65)return encounterResult(true,'',m.needle>=.43&&m.needle<=.57?1.5:1);if(++m.mistakes>=3)return encounterResult(false);}
  else if(k.startsWith('trade:')){const i=+k.slice(6),cost=[15,35,55][i];if(!cost||P.stones<cost)return;P.stones-=cost;const reward=i===0?(heal(P.st.maxHp*.45),'回复 45% 气血'):i===1?(P.attrPts+=2,'属性点 +2'):addToBag(genItem(null,2,RUN.ch));encounterResult(false,e.ending+' '+reward);return;}
  else if(k==='risk'){if(Math.random()<Math.max(.25,.95-m.score*.15)){m.score++;sfx('pick');}else{hpCost(P.st.maxHp*.12);return encounterResult(false,'探索失手，本次收获散去，气血 -12%。');}}
  else if(k==='bank'&&m.score>0)return encounterResult(true,'',m.score);
  renderEncounter();
}

/* Extension event routing: capture keeps original actions intact. */
overlay.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,k=b.dataset.k;
  const custom=['savehub','saveback','export-save','copy-save','preview-import','pick-save','confirm-import','region','journal','journalback','fast-toggle','atlas-finish','continue','new-confirm'];
  if(!custom.includes(a)){
    if(a==='mev'&&MEV?.event){ev.stopImmediatePropagation();audioInit();MEV.act(k);return;}
    setTimeout(()=>{if(P&&RUN&&!inEncounter&&['map','bag','attr','skills'].includes(state))captureMap();},0);return;
  }
  ev.stopImmediatePropagation();audioInit();
  if(a==='continue'){if(!loadRun())showTitle();}
  else if(a==='new-confirm'){showOverlay(`<div class="panel"><h2>开启新的轮回？</h2><p class="story">当前这一世的进度会在入山时被替换。轮回点和已解锁宗门会保留。建议先备份。</p><div class="actions">${btn('setup','选择宗门',null,'red')}${btn('savehub','先备份',null,'ghost')}${btn('title','返回',null,'ghost')}</div></div>`);}
  else if(a==='savehub')showSaveHub();else if(a==='saveback'){importCandidate=null;saveReturn?.();}
  else if(a==='export-save'){download('御剑问仙-存档-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(envelope(),null,2));toast('已请求下载备份；微信不支持时请使用存档码。');}
  else if(a==='copy-save'){const code=await compactCode();if(!$('export-code'))return;$('export-code').value=code;$('export-code').focus();$('export-code').select();try{await navigator.clipboard.writeText(code);toast('存档码已复制，请粘贴到备忘录妥善保存。');}catch(e){toast('存档码已生成，请长按文本框全选并复制。');}}
  else if(a==='preview-import')previewImport();else if(a==='pick-save')$('save-file').click();
  else if(a==='confirm-import'&&importCandidate){applySave(importCandidate);persist();importCandidate=null;P=null;RUN=null;STAGE=null;MEV=null;showTitle();toast('存档已恢复，点击「继续修行」。');}
  else if(a==='region'){mapView=+k;showMap();}else if(a==='journal')showJournal();else if(a==='journalback')bookReturn?.();
  else if(a==='fast-toggle'){settings.fast=!settings.fast;persist();showMap();toast(settings.fast?'迅行模式开启：普通关以三轮兽潮为目标。':'标准模式开启：保留计时，也能按 F 提前迎战。');}
  else if(a==='atlas-finish'){if(!MEV?.done||k!==MEV.node)return;const node=MEV.node;MEV=null;if(pendingLv>0)openLevelUp(()=>completeNode(node));else completeNode(node);}
},true);

/* Growth balance: bounded stacking, effective-damage lifesteal, readable hazards. */
const soft=(value,knee,limit)=>value<=knee?value:knee+(limit-knee)*(1-Math.exp(-(value-knee)/(limit-knee)));
const baseRecalc=recalc;
recalc=function(){const hpBefore=P?.hp;const hadStats=!!P?.st;baseRecalc();const s=P.st,b=s.raw;
  s.dmg=1+soft(Math.max(0,b.dmg),.5,1.4);s.wMul=1+soft(Math.max(0,b.wdmg),.4,1.1);s.gMul=1+soft(Math.max(0,b.gdmg),.4,1.1);
  s.armorMul=1-soft(Math.max(0,b.armor),.25,.55);s.dodge=soft(Math.max(0,b.dodge),.1,.3);s.crit=soft(Math.max(0,b.crit+b.luck*.0015),.2,.5);
  s.cdMul=1-soft(Math.max(0,b.cd),.2,.4);s.area=1+soft(Math.max(0,b.area),.25,.7);s.lifesteal=soft(Math.max(0,b.lifesteal),.015,.045);s.healMul=1+soft(Math.max(0,b.heal),.3,.65);
  s.regen=Math.min(s.regen,s.maxHp*.004,1.8);s.critMul=Math.min(s.critMul,2.1);s.xpMul=1+soft(Math.max(0,b.xp),.4,1.2);s.petMul=1+soft(Math.max(0,b.pet),.6,1.4);s.speed=Math.min(s.speed,280);
  if(hadStats)P.hp=Math.min(hpBefore,s.maxHp);
};
dmgFactor=function(cat){const raw=P.st.raw;let m=1+soft(Math.max(0,raw.dmg)+(cat==='w'?Math.max(0,raw.wdmg):cat==='g'?Math.max(0,raw.gdmg):0),.6,1.8);if(P.st.body)m*=1+.15*P.hp/P.st.maxHp;if(P.st.soul)m*=1+Math.min(.2,P.soulKills*.00015);return m;};
SECTS.jingang.perk='气血 +60，减伤 +15%，高气血最多额外增伤 15%';SECTS.youming.perk='斩妖积累魂力，额外伤害最多 +20%，击杀有几率回血';
const baseHeal=heal;
heal=function(n,show){if(state==='play'&&STAGE&&!show){const allowed=Math.max(0,P.healCredit||0);const actual=Math.min(n*P.st.healMul,allowed);P.healCredit=allowed-actual;return baseHeal(actual/P.st.healMul,show);}return baseHeal(n,show);};
const baseHit=hit;
hit=function(e,dmg,sx,sy,kb,cat,eff){if(e.dead)return;const before=e.hp,ls=P.st.lifesteal;let proposed=dmg;
  if(e.boss||e.guardian){const slot=Math.floor(STAGE.clock||0);if(e.burstSlot!==slot){e.burstSlot=slot;e.burstUsed=0;}const exposed=((STAGE.clock||0)%9)>=6;const budget=e.maxHp*(exposed?.16:.08);const remaining=Math.max(0,budget-(e.burstUsed||0));if(remaining<=0)return;proposed=Math.min(proposed,remaining/(Math.max(1,dmgFactor(cat))*P.st.critMul*1.1));}
  P.st.lifesteal=0;try{baseHit(e,proposed,sx,sy,kb,cat,eff);}finally{P.st.lifesteal=ls;}
  const actual=Math.min(before,Math.max(0,before-e.hp));if(e.boss||e.guardian)e.burstUsed=(e.burstUsed||0)+actual;if(ls&&actual>0)heal(actual*ls*.5);
};
const baseUpdate=update;
update=function(dt){if(!STAGE)return;P.healCredit=Math.min(Math.min(6,P.st.maxHp*.012),(P.healCredit||0)+Math.min(6,P.st.maxHp*.012)*dt);baseUpdate(dt);};
const paceStage=updStage;
updStage=function(dt){const s=STAGE;paceStage(dt);if(!STAGE||state!=='play'||s.done)return;s.telegraphs=s.telegraphs||[];s.hazardAt??=14;
  if(s.clock>=s.hazardAt&&!enemies.some(e=>e.bossV7&&!e.dead)){s.hazardAt=s.clock+Math.max(4.5,7-s.ch*.7);s.telegraphs.push({x:P.x,y:P.y,r:65+s.ch*5,t:0,dur:1.45});if(!s.warnedHazard){s.warnedHazard=true;banner('妖气锁定 · 离开红圈');}}
  for(const h of s.telegraphs){h.t+=dt;if(h.t>=h.dur&&!h.done){h.done=true;fx.push({k:'boom',x:h.x,y:h.y,r:h.r,t:0,dur:.5});if(d2(P,h)<(h.r+P.r*.5)**2){const armor=P.st.armorMul,dodge=P.st.dodge;P.st.armorMul=1;P.st.dodge=0;try{hurt(P.st.maxHp*.22);}finally{P.st.armorMul=armor;P.st.dodge=dodge;}if(!STAGE||state!=='play')return;}}}
  s.telegraphs=s.telegraphs.filter(h=>!h.done);
};
const paintedGround=drawGround;
drawGround=function(cx,cy,scene){paintedGround(cx,cy,scene);if(!STAGE?.telegraphs)return;const c=ctx;c.save();for(const h of STAGE.telegraphs){const k=Math.min(1,h.t/h.dur);c.fillStyle=`rgba(228,100,73,${.08+.12*k})`;c.strokeStyle='#f5a383';c.lineWidth=2;c.beginPath();c.arc(h.x,h.y,h.r,0,7);c.fill();c.stroke();c.fillStyle='#ef886b';c.globalAlpha=.24;c.beginPath();c.arc(h.x,h.y,h.r*k,0,7);c.fill();c.globalAlpha=1;c.strokeStyle='#ffe1af';c.beginPath();c.moveTo(h.x-9,h.y);c.lineTo(h.x+9,h.y);c.moveTo(h.x,h.y-9);c.lineTo(h.x,h.y+9);c.stroke();}c.restore();};
const balancedStats=statPanel;statPanel=function(){return balancedStats()+`<div class="notice"><b>成长规则</b>：高额属性收益递减。减伤上限 55%，闪避 30%，冷却缩减 40%，暴击 50%。伤害与兵器／功法加成合并计算；吸血按有效伤害结算，战斗治疗每秒最多回复 1.2% 气血（上限 6），自然回复另计。更换装备或心法不会免费回血。<br><b>走位提示</b>：红圈锁定 1.45 秒后落雷，命中损失 22% 最大气血，不受减伤和闪避属性影响。离开红圈即可躲开。首领每 9 秒露出 3 秒破绽，护体罡气抑制瞬间秒杀。</div>`;};

/* Loadout management: store passive levels, swap on map or in paused combat. */
let manualBack=null,swapTarget=null;
function backToPause(){state='play';pause();}
function persistLoadout(){if(STAGE){const prev=state;state='pause';captureBattle();state=prev;}else if(!inEncounter)captureMap();updSkillsHud();}
function refreshEvolution(){P.unboundEvo=P.unboundEvo||{};for(const k of ACTIVE){if(P.evo[k]&&!P.sk[SK[k].evo.pair]){P.unboundEvo[k]=true;delete P.evo[k];}if(P.unboundEvo[k]&&P.sk[SK[k].evo.pair]){P.evo[k]=true;delete P.unboundEvo[k];}}if(P.sk.sword&&STAGE){swords=[];syncSwords();}recalc();}
function showManuals(back){if(back)manualBack=back;state='manuals';P.manualArchive=P.manualArchive||{};const equipped=Object.keys(P.sk).filter(k=>SK[k].cat==='p');const stored=Object.keys(P.manualArchive).filter(k=>P.manualArchive[k]>0);
  showOverlay(`<div class="panel"><p class="eyebrow">CULTIVATION / LOADOUT</p><h2>心法行箧</h2><p class="sub">已装备 ${equipped.length}/${MAX_PASSIVE} · 学过的重数永久保留在本轮回内</p><div class="notice">卸下心法后，其属性和对应进化会暂停生效；重新装备即可恢复。六格已满时，先选择一本收纳心法，再选择要替换的槽位。卸下一本还能腾出位置，在后续突破时学习新的心法。战斗中调整会暂停时间，返回后继续。</div><h3>${swapTarget?'选择被替换的心法 → '+SK[swapTarget].name:'当前装备'}</h3><div class="picks">${equipped.map(k=>`<div class="pickc"><b>${SK[k].name} · ${P.sk[k]} 重</b><span>${SK[k].desc()}（每重）</span>${btn(swapTarget?'manual-swap':'manual-off',swapTarget?'替换此心法':'卸下收纳',k,'ghost sm')}</div>`).join('')||'<p class="help">尚未装备心法。</p>'}</div><h3>已收纳</h3><div class="picks">${stored.map(k=>`<div class="pickc"><b>${SK[k].name} · ${P.manualArchive[k]} 重</b><span>${SK[k].desc()}（每重）</span>${btn('manual-on',equipped.length>=MAX_PASSIVE?'选择替换':'装备心法',k,'sm')}</div>`).join('')||'<p class="help">卸下的心法会保存在这里，不会丢失重数。</p>'}</div><div class="actions">${btn('manual-back','返回',null,'ghost')}${swapTarget?btn('manual-cancel','取消替换',null,'ghost'):''}</div></div>`);
}
function manualAction(a,k){P.manualArchive=P.manualArchive||{};if(a==='manual-off'&&SK[k]?.cat==='p'&&P.sk[k]){P.manualArchive[k]=P.sk[k];delete P.sk[k];}
  else if(a==='manual-on'&&P.manualArchive[k]){if(passiveCount()>=MAX_PASSIVE){swapTarget=k;return showManuals();}P.sk[k]=P.manualArchive[k];delete P.manualArchive[k];}
  else if(a==='manual-swap'&&swapTarget&&P.manualArchive[swapTarget]&&SK[k]?.cat==='p'&&P.sk[k]){P.manualArchive[k]=P.sk[k];delete P.sk[k];P.sk[swapTarget]=P.manualArchive[swapTarget];delete P.manualArchive[swapTarget];swapTarget=null;}
  else return;refreshEvolution();persistLoadout();showManuals();
}
const baseAddSkill=addSkill;addSkill=function(k,n){if(SK[k]?.cat==='p'&&!P.sk[k]&&P.manualArchive?.[k]){if(passiveCount()>=MAX_PASSIVE)return 0;const archived=P.manualArchive[k];delete P.manualArchive[k];P.sk[k]=archived;refreshEvolution();}const result=baseAddSkill(k,n);if(P.unboundEvo)refreshEvolution();return result;};
const baseCanTake=canTake;canTake=function(k){if(SK[k]?.cat==='p'&&!P.sk[k]&&P.manualArchive?.[k]>=SK[k].max)return false;return baseCanTake(k);};
const pauseWithSave=pause;pause=function(){pauseWithSave();if(state==='pause'){overlay.querySelector('.actions').insertAdjacentHTML('beforeend',btn('combat-bag','行囊 · 换装备',null,'ghost')+btn('manual-open','调整心法',null,'ghost'));overlay.querySelector('.panel').insertAdjacentHTML('beforeend','<p class="help">B 打开行囊 · 心法可卸下重配 · 离开红圈躲避落雷</p>');}};
const baseShowSkills=showSkills;showSkills=function(back){baseShowSkills(back);overlay.querySelector('.actions').insertAdjacentHTML('afterbegin',btn('manual-open','调整心法',null,'ghost'));};
const baseBagAct=bagAct;bagAct=function(a,k){baseBagAct(a,k);if(['equip','unequip','sell'].includes(a)){if(P.t&&a==='equip')P.t.weapon=Math.max(P.t.weapon||0,.4);persistLoadout();}};
document.addEventListener('keydown',e=>{if(e.code==='KeyB'&&!e.repeat&&['play','pause','map'].includes(state)){e.preventDefault();if(state==='play')pause();bagSel=null;showBag(STAGE?backToPause:backToMap);}});
const mapWithAtlas=showMap;showMap=function(){mapWithAtlas();overlay.querySelector('.world-top .actions').insertAdjacentHTML('beforeend',btn('manual-open','心法',null,'ghost sm'));};
overlay.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,k=b.dataset.k;if(!['combat-bag','manual-open','manual-back','manual-cancel','manual-on','manual-off','manual-swap'].includes(a))return;e.stopImmediatePropagation();
  if(a==='combat-bag'){bagSel=null;showBag(backToPause);}else if(a==='manual-open'){swapTarget=null;showManuals(STAGE?backToPause:backToMap);}else if(a==='manual-back'){swapTarget=null;manualBack?.();}else if(a==='manual-cancel'){swapTarget=null;showManuals();}else manualAction(a,k);
},true);



/* ================================================================

   图集：registerAtlas('data:image/webp;base64,...', 列数, 行数, ['键名1','键名2',...])  按从左到右、从上到下的顺序对应格子

/* Battle art v2: rendering-only changes; save schema and combat rules unchanged. */
const monsterArt = new Image(); deferBattleArt(monsterArt,'assets/monsters.webp');
const terrainArt = new Image(); deferBattleArt(terrainArt,'assets/terrain.webp');
const sceneryArt = new Image(); deferBattleArt(sceneryArt,'assets/scenery.webp');
const artSceneIndex={bamboo:0,desert:1,underworld:2};
const artColors={bamboo:['#0d2929','#74d7bd','#dbd0a0'],desert:['#36291e','#efa854','#ffe0a0'],underworld:['#171b30','#9b9dfb','#70e9e0']};
const terrainPatterns={};
let vividCombat=true;
try{vividCombat=localStorage.getItem('yjwx-vivid-combat')!=='off';}catch{}
const quietMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function artGlow(x,y,r,col,alpha=.25){const c=ctx;c.save();const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,col+'00');c.globalAlpha=alpha;c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);c.restore();}
function artRune(x,y,r,col,t=0){const c=ctx;c.save();c.translate(x,y);c.rotate(t);c.strokeStyle=col;c.lineWidth=1.3;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.moveTo(r*.78,0);c.arc(0,0,r*.78,0,Math.PI*2);c.stroke();for(let i=0;i<8;i++){c.save();c.rotate(i*Math.PI/4);c.beginPath();c.moveTo(r*.83,-3);c.lineTo(r*.94,-3);c.moveTo(r*.85,2);c.lineTo(r*.92,2);c.stroke();c.restore();}c.restore();}
drawGround=function(cx,cy,scene){
 const c=ctx,colors=artColors[scene]||artColors.bamboo;c.save();c.fillStyle=colors[0];c.fillRect(cx,cy,W,H);
 if(terrainArt.complete&&terrainArt.naturalWidth){if(!terrainPatterns[scene]){const tile=document.createElement('canvas');tile.width=1536;tile.height=1536;const tc=tile.getContext('2d');const sw=terrainArt.naturalWidth/3;for(let ty=0;ty<2;ty++)for(let tx=0;tx<2;tx++){tc.save();tc.translate(tx?1536:0,ty?1536:0);tc.scale(tx?-1:1,ty?-1:1);tc.drawImage(terrainArt,(artSceneIndex[scene]||0)*sw,0,sw,terrainArt.naturalHeight,0,0,768,768);tc.restore();}terrainPatterns[scene]=c.createPattern(tile,'repeat');}c.globalAlpha=settings.clearBattle?.2:.43;c.fillStyle=terrainPatterns[scene];c.fillRect(cx,cy,W,H);c.globalAlpha=1;}
 // World-anchored landmarks vary by cell; never scroll with the camera.
 const step=510;
 for(let j=Math.floor(cy/step)-1;j<=Math.ceil((cy+H)/step);j++)for(let i=Math.floor(cx/step)-1;i<=Math.ceil((cx+W)/step);i++){
  const h=hash(i+33,j-12),x=i*step+60+h*260,y=j*step+hash(j+18,i)*260;
  c.save();c.translate(x,y);
  if(sceneryArt.complete&&sceneryArt.naturalWidth){const cell=(artSceneIndex[scene]||0)+(h>.5?3:0),sw=sceneryArt.naturalWidth/3,sh=sceneryArt.naturalHeight/2,size=h>.5?150:230;c.globalAlpha=settings.clearBattle?.28:.82;c.drawImage(sceneryArt,(cell%3)*sw,Math.floor(cell/3)*sh,sw,sh,-size/2,-size*.78,size,size*sh/sw);c.restore();continue;}
  if(h<.32){ // Ancient circular dais with broken paving.
   c.fillStyle=scene==='desert'?'#493824':'#142a31';c.strokeStyle=colors[2]+'40';c.lineWidth=3;c.beginPath();c.ellipse(0,0,108,66,0,0,7);c.fill();c.stroke();c.globalAlpha=.22;artRune(0,0,55,colors[1],Math.PI/8);c.globalAlpha=.5;c.strokeStyle=colors[2];c.lineWidth=1;for(let k=0;k<7;k++){const a=k*.9+h;c.beginPath();c.moveTo(Math.cos(a)*67,Math.sin(a)*40);c.lineTo(Math.cos(a)*100,Math.sin(a)*62);c.stroke();}
  }else if(h<.62){ // Reflecting pools, hot fissures, or soul pools.
   c.fillStyle=scene==='desert'?'#271e1b':'#0a222b';c.strokeStyle=colors[1]+'55';c.lineWidth=2;c.beginPath();c.ellipse(0,0,80,29,h,0,7);c.fill();c.stroke();c.globalAlpha=.24;for(let k=0;k<3;k++){c.beginPath();c.ellipse(k*9-12,0,28+k*14,7+k*5,h,0,Math.PI*1.5);c.stroke();}if(vividCombat)artGlow(0,0,75,colors[1],.1);
  }else{ // Carved waystones with a warm/cold lantern.
   c.fillStyle='#0005';c.beginPath();c.ellipse(10,12,31,12,0,0,7);c.fill();c.fillStyle=scene==='desert'?'#76604a':'#35444c';c.strokeStyle=colors[2]+'70';c.lineWidth=1.5;c.beginPath();c.moveTo(-15,8);c.lineTo(-19,-31);c.lineTo(-9,-49);c.lineTo(12,-43);c.lineTo(20,7);c.closePath();c.fill();c.stroke();c.fillStyle=colors[1];c.globalAlpha=.7;c.fillRect(-3,-32,3,22);c.fillRect(-8,-24,13,2);c.globalAlpha=1;if(vividCombat)artGlow(0,-22,38,colors[1],.2);
  }
  c.restore();
 }
 // A few vegetation silhouettes, rather than repeated dense props.
 for(let j=Math.floor(cy/230);j<Math.ceil((cy+H)/230)+1;j++)for(let i=Math.floor(cx/230);i<Math.ceil((cx+W)/230)+1;i++){
  const h=hash(i+70,j+30);if(h<.82)continue;const x=i*230+h*120,y=j*230+hash(j,i)*130;c.save();c.globalAlpha=.15;c.strokeStyle=colors[1];c.lineWidth=1;for(let k=0;k<5;k++){c.beginPath();c.moveTo(x+k*3,y);c.quadraticCurveTo(x+k*4,y-8,x+k*5-6,y-14-h*7);c.stroke();}c.restore();

function journey(){if(!P)return null;P.journey ||= {routes:{},seen:{},talks:{},gifts:{},quests:{},stock:{},relics:[],claims:[],log:[],choices:[],companion:null,insights:0};const j=P.journey;j.choices||=[];META.contacts||={};return j;}
function route(){return JOURNEY_REGIONS[RUN?.ch||0][journey()?.routes[RUN?.ch||0]||0];}
function contact(k){return META.contacts?.[k]||0;}
function addContact(k,n){journey();META.contacts[k]=Math.min(100,Math.max(0,contact(k)+n));}
function record(t){const j=journey();j.log.push(t);if(j.log.length>45)j.log.shift();}
function grantSupply(k,n=1){const j=journey();if(!SUPPLIES[k])return;if(SUPPLIES[k].type==='随身奇珍'){if(j.relics.includes(k)){P.stones+=15;return;}j.relics.push(k);}else j.stock[k]=Math.min(99999,(j.stock[k]||0)+n);}
function travelSave(){persistLoadout();}
function setRegion(){if(!P||!RUN)return;for(let ch=0;ch<3;ch++){const rr=JOURNEY_REGIONS[ch][journey().routes[ch]||0];REGIONS[ch].name=rr.name;REGIONS[ch].sub=rr.sub;CHAPTERS[ch].name=rr.name;}const r=route();Object.assign(REGIONS[RUN.ch],{name:r.name,sub:r.sub,color:r.color,intro:r.rule+'。'+['追寻失踪师父留下的断简，寻找第一枚界印。','调查旧阵的真正用途，找回师父被典当的名字。','抵达界门，为师父与守门人的命运作出选择。'][RUN.ch],areas:r.sub.split(' · ').concat('界印'),landmarks:r.land.split(',')});for(const row of RUN.map.rows)for(const n of row)n.label=r.land.split(',')[n.r]+(row.length>1?['·左路','·中路','·右路'][n.i]:'');CHAPTERS[RUN.ch].name=r.name;}

function chooseStory(i){if(state!=='story'||!storyPending||![0,1].includes(i))return;const s=storyPending,j=journey();if(j.seen[s.key])return;j.seen[s.key]=true;j.choices.push(i);record(STORY[s.ch][s.beat].title+'：'+STORY[s.ch][s.beat].choices[i]);storyPending=null;captureMap();enterNode(s.id);}
function showEndingChoice(id){state='ending-choice';const friends=Object.keys(TRAVELERS).filter(k=>contact(k)>=30).length;storyPending={id};showOverlay(`<div class="panel"><h2>界门之前</h2><p class="story">这不是胜利后的空话。你现在决定破阵后如何使用界印。击败妖王，才能兑现承诺。</p>${btn('j-ending','重铸封印 · 与至少三位知交共同承担，不再献祭守门人','renew','story-choice',friends<3)}<p class="help">知交 ${friends}/3（好感至少 30）；可以先返回地图与修士交谈、赠礼、完成委托。</p>${btn('j-ending','续燃灯火 · 先稳定界门，接回师父，留下寻找新阵心的约定','guard','story-choice ghost')}${btn('j-ending','打开归途 · 放弃飞升，将界印化为凡人撤离的桥','bridge','story-choice ghost')}${btn('map','返回准备',null,'ghost')}</div>`);}

function npcAct(a,k){const n=TRAVELERS[k];if(!n||n.ch>RUN.ch)return;const j=journey(),key=k+':'+RUN.ch;if(a==='j-talk'&&j.talks[k]!==RUN.nodes){j.talks[k]=RUN.nodes;addContact(k,5);record('与'+n.name+'谈起了'+route().name+'的往事。');}else if(a==='j-gift'&&j.stock[n.gift]>0&&(j.gifts[key]||0)<3){j.stock[n.gift]--;j.gifts[key]=(j.gifts[key]||0)+1;addContact(k,5);}else if(a==='j-quest'&&!j.quests[key]&&j.stock[n.item]>=3){j.stock[n.item]-=3;j.quests[key]=true;addContact(k,15);grantSupply('potion');grantSupply('ward');record(n.name+'的委托已完成。');}captureMap();showPerson(k);}

function useSupply(k){const j=journey();if(!['potion','ward','insight'].includes(k)||!(j.stock[k]>0))return false;if(k==='potion'){if(P.hp>=P.st.maxHp)return toast('气血已满，丹药未消耗。');if(STAGE&&(STAGE.potionsUsed||0)>=2)return toast('本场已服用两枚回春丹。');P.hp=Math.min(P.st.maxHp,P.hp+P.st.maxHp*.25);if(STAGE)STAGE.potionsUsed=(STAGE.potionsUsed||0)+1;}if(k==='ward'){if(!STAGE)return toast('进入战斗后暂停，再使用护身符。');if((STAGE.wardsUsed||0)>=2)return toast('本场已使用两张护身符。');addShield(P.st.maxHp*.15,0);STAGE.wardsUsed=(STAGE.wardsUsed||0)+1;}if(k==='insight'){if((j.insights||0)>=5)return toast('本轮回已参悟五卷，留待其他用途。');j.insights=(j.insights||0)+1;P.attrPts++;}j.stock[k]--;travelSave();showSupplies();toast('已使用'+SUPPLIES[k].name);return true;}

    M.ends = M.ends || []; M.deaths = M.deaths || 0; M.stele = M.stele || 0; M.pendingDream = M.pendingDream || null;

  if (k.flags.jiming && k.flags.zhengci && M.stele < 3){ M.stele++; rep.stele = true; }
  const ok = { 1:true, 2:RUN.ch >= 1, 3:!!k.flags.zhengwu, 4:contact('deng') >= 30, 5:RUN.ch >= 2 && (j.routes[2] || 0) === 0,
               6:(M.bonds.deng || 0) >= 2 && M.life >= 5, 7:M.stele >= 3 };
  const got = [1, 2, 3, 4, 5, 6, 7].find(n => !M.mem.includes(n) && ok[n]);
  if (got){ M.mem.push(got); M.mem.sort((a, b) => a - b); M.pendingDream = got; rep.mem = got; }

}

/* ================================================================
   配乐模块（v1.5，Claude）：场景配乐、交叉淡化、按需加载
   曲目放在 assets/music/；任一曲目加载失败时，自动退回原有的合成古筝。
   ================================================================ */
const MUSIC_BASE = 'assets/music/';
const MUSIC_VOL = 0.55, MUSIC_FADE = 1.8, MUSIC_LOOP_XF = 2.5;
const MUSIC = { cur:null, want:null, a:null, b:null, unlocked:false, failed:{}, playing:false };
function musicScene(){
  const sc = (P && P.scene) || (RUN && CHAPTERS[RUN.ch] && CHAPTERS[RUN.ch].scene) || 'bamboo';
  return ['bamboo', 'desert', 'underworld'].includes(sc) ? sc : 'bamboo';
}
function musicWant(){
  const s = state;
  if (s === 'win') return 'ending';
  if (['story', 'dream', 'arc', 'local-story', 'ending-choice', 'over'].includes(s)) return 'story';
  if (STAGE && ['play', 'pause', 'levelup', 'event', 'bingjie'].includes(s)){
    const boss = STAGE.obj === 'boss' || (STAGE.boss && !STAGE.boss.dead);
    return boss ? 'battle_boss' : 'battle_' + musicScene();
  }
  if (!P || !RUN || ['title', 'setup', 'meta', 'savehub', 'journal'].includes(s)) return 'title';
  return 'map_' + musicScene();
}
// iOS 的 Safari 不允许网页直接改音量，所以经 Web Audio 增益节点控制；本地 file:// 打开时退回 el.volume
function musicEl(){
  const el = new Audio(); el.preload = 'auto'; el.loop = false; el.crossOrigin = 'anonymous';
  el.addEventListener('error', () => { if (el.dataset.track) MUSIC.failed[el.dataset.track] = true; });
  try {
    if (location.protocol !== 'file:' && SFX.ctx){ const src = SFX.ctx.createMediaElementSource(el), g = SFX.ctx.createGain(); g.gain.value = 0; src.connect(g); g.connect(SFX.ctx.destination); el._gain = g; }
  } catch (e) { el._gain = null; }
  if (!el._gain) el.volume = 0;
  return el;
}
const getVol = el => el._gain ? el._gain.gain.value : el.volume;
const setVol = (el, v) => { v = Math.max(0, Math.min(1, v)); if (el._gain) el._gain.gain.value = v; else el.volume = v; };
const musicOn = () => !META.muted && META.bgm !== false;
function musicFade(el, to, sec, done){
  if (!el) return;
  const from = getVol(el), t0 = performance.now();
  clearInterval(el._fade);
  el._fade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / (sec * 1000));
    try { setVol(el, from + (to - from) * k); } catch (e) {}
    if (k >= 1){ clearInterval(el._fade); if (done) done(); }
  }, 50);
}
function musicStart(track){
  const el = MUSIC.a && !MUSIC.a.paused && MUSIC.a.dataset.track ? (MUSIC.b ||= musicEl()) : (MUSIC.a ||= musicEl());
  const old = el === MUSIC.a ? MUSIC.b : MUSIC.a;
  el.dataset.track = track;
  if (!el.src || !el.src.endsWith(track + '.mp3')) el.src = MUSIC_BASE + track + '.mp3';
  try { el.currentTime = 0; } catch (e) {}
  setVol(el, 0);
  const p = el.play();
  if (p && p.catch) p.catch(() => { MUSIC.playing = false; });
  musicFade(el, MUSIC_VOL, MUSIC_FADE);
  if (old && !old.paused) musicFade(old, 0, MUSIC_FADE, () => { try { old.pause(); } catch (e) {} });
  MUSIC.cur = track; MUSIC.playing = true;
}
function musicStop(){
  for (const el of [MUSIC.a, MUSIC.b]) if (el && !el.paused) musicFade(el, 0, 0.8, () => { try { el.pause(); } catch (e) {} });
  MUSIC.cur = null; MUSIC.playing = false;
}
function musicTick(){
  if (!MUSIC.unlocked || document.hidden) return;
  if (!musicOn()){ if (MUSIC.cur) musicStop(); return; }
  const want = musicWant();

/* ================================================================

   - 灵石：每提前 1 秒得 1.2 ×（章节+1）；上一波残余妖物超过 25 只时 ×1.5（叠浪）
   - 战意：每次提前鸣钟 +1 层（最多 5 层，本关有效），每层伤害 +5%、修为获取 +8%
   - 提前召唤妖王/镇守（提前超过 5 秒）或战意 ≥3：本关战利品装备品质 +1

const RUSH = { manual:false };
function rushReward(saved){
  const s = STAGE; if (!s || saved <= 0.5) return;
  const alive = enemies.filter(e => !e.dead).length, overlap = alive > 25;
  const stones = Math.round(saved * 1.2 * (1 + s.ch) * (overlap ? 1.5 : 1));
  s.rushSaved = (s.rushSaved || 0) + saved; s.rushStones = (s.rushStones || 0) + stones;
  s.zhanyi = Math.min(5, (s.zhanyi || 0) + 1);
  P.stones += stones;
  texts.push({ x:P.x, y:P.y - 40, v:`鸣钟赏 +${stones} 灵石${overlap ? ' · 叠浪' : ''}`, t:0, heal:true });
  toast(`提前 ${Math.round(saved)} 秒迎战：灵石 +${stones}${overlap ? '（叠浪 ×1.5）' : ''}，战意 ×${s.zhanyi}`);
}

rush = function(){ RUSH.manual = true; try { return _rushOrig(); } finally { RUSH.manual = false; } };
const _assaultRush = assault;
assault = function(){
  const s = STAGE, early = RUSH.manual && s && !s.done ? (s.nextWave || 0) - (s.clock || 0) : 0;
  const r = _assaultRush();
  try { if (early > 0.5) rushReward(early); } catch (e) {}
  return r;
};
const _summonFinalRush = summonFinal;
summonFinal = function(){
  const s = STAGE, had = s && (s.boss || s.guardian);
  const due = s ? (s.fast ? 12 : s.obj === 'boss' ? 150 : 120) : 0, early = RUSH.manual && s && !had ? due - (s.clock || 0) : 0;
  const r = _summonFinalRush();
  try { if (early > 0.5 && (s.boss || s.guardian)){ rushReward(early); if (early > 5) s.rushFinal = true; } } catch (e) {}
  return r;
};
const zhanyi = () => (STAGE && STAGE.zhanyi) || 0;
const _hitRush = hit;
hit = function(e, dmg, ...rest){ return _hitRush(e, zhanyi() ? dmg * (1 + 0.05 * zhanyi()) : dmg, ...rest); };
const _gainXpRush = gainXp;
gainXp = function(v){ return _gainXpRush(zhanyi() ? v * (1 + 0.08 * zhanyi()) : v); };
const _hudRush = hud;

};

finishStage = function(win){

      const i = RW.opts.findIndex(o => o.item && o.item.rar < 4);

    }

};

/* —— 自动流畅模式：帧率过低时降低画面精度、关闭华丽特效 —— */
const PERF = { last:0, acc:0, n:0, slow:0, done:false };
const _resizePerf = resize;
resize = function(){ _resizePerf(); if (PERF.done && DPR > 1){ DPR = 1; cvs.width = Math.round(W); cvs.height = Math.round(H); } };
const _updatePerf = update;
update = function(dt){
  _updatePerf(dt);
  if (state === 'play' && !PERF.done){
    const now = performance.now();
    if (PERF.last){ const gap = now - PERF.last; if (gap < 500){ PERF.acc += gap; PERF.n++; } }
    PERF.last = now;
    if (PERF.n >= 90){
      PERF.slow = PERF.acc / PERF.n > 30 ? PERF.slow + 1 : 0; PERF.acc = 0; PERF.n = 0;
      if (PERF.slow >= 2){ PERF.done = true; try { vividCombat = false; } catch (e) {} resize(); toast('检测到画面卡顿，已自动切换为流畅模式。'); }
    }
  } else PERF.last = 0;
  if (state === 'play'){ for (const f of TVFX){ f.t += dt; if (f.style === 'return'){ f.x = P.x; f.y = P.y; } } for (let i = TVFX.length - 1; i >= 0; i--) if (TVFX[i].t >= TVFX[i].dur) TVFX.splice(i, 1); }
};
const _drawWorldTV = drawPhase1World;
drawPhase1World = function(){
  _drawWorldTV();
  const c = ctx;
  for (const f of TVFX){
    const k = f.t / f.dur, [col, g] = RING_STYLES[f.style];
    if (f.style === 'return'){
      const rr = f.r * (0.55 + 0.45 * Math.min(1, k * 2));
      c.globalAlpha = 0.25 * (1 - k); c.strokeStyle = col; c.lineWidth = 2; c.beginPath(); c.arc(f.x, f.y, f.r, 0, 7); c.stroke();
      for (let i = 0; i < 6; i++){
        const a = i / 6 * Math.PI * 2 + f.t * 11;
        c.save(); c.translate(f.x + Math.cos(a) * rr, f.y + Math.sin(a) * rr); c.rotate(a + Math.PI / 2);
        c.globalAlpha = 0.9 * (1 - k); c.fillStyle = col; c.beginPath(); c.moveTo(0, -12); c.lineTo(3, 6); c.lineTo(-3, 6); c.closePath(); c.fill();
        c.globalAlpha = 0.35 * (1 - k); c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, 0.01, 0, 7); c.stroke();
        c.restore();
        c.globalAlpha = 0.35 * (1 - k); c.strokeStyle = col; c.lineWidth = 2.5; c.beginPath(); c.arc(f.x, f.y, rr, a - 0.5, a); c.stroke();
      }
    } else {
      c.globalAlpha = 0.7 * (1 - k); c.strokeStyle = col; c.lineWidth = 3;
      c.beginPath(); c.arc(f.x, f.y, f.r * (0.5 + 0.5 * k), 0, 7); c.stroke();
      c.globalAlpha = 0.12 * (1 - k); c.fillStyle = col; c.beginPath(); c.arc(f.x, f.y, f.r, 0, 7); c.fill();
      c.globalAlpha = 0.8 * (1 - k); c.fillStyle = col; c.font = '15px "Ma Shan Zheng","Kaiti SC",serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      for (let i = 0; i < 4; i++){ const a = i * Math.PI / 2 + k; c.fillText(g, f.x + Math.cos(a) * f.r * (0.5 + 0.5 * k), f.y + Math.sin(a) * f.r * (0.5 + 0.5 * k)); }
      c.textBaseline = 'alphabetic';
    }
  }
  c.globalAlpha = 1;
};

const verNum = v => v.split('.').reduce((a, n) => a * 1000 + (+n || 0), 0);
const NOTICE_LATEST = NOTICES[0].v;
function unseenNotices(){ const seen = settings.noticeSeen || '0.0.0'; return NOTICES.filter(n => verNum(n.v) > verNum(seen)); }
function isVeteran(){ return (META.runs || 0) > 0 || !!(META.karma && META.karma.life > 0) || (typeof hasRun === 'function' && hasRun()); }
function showNotice(list, auto){
  const items = (list && list.length ? list : NOTICES.slice(0, 1));
  state = 'notice';
  showOverlay(`<div class="panel"><p class="journey-kicker">更新公告</p><h2>问道篇 v${items[0].v}</h2>
    ${items.map(n => `<section class="journey-banner" style="text-align:left"><h3>v${n.v} · ${n.title}</h3>${n.items.map(t => `<p>· ${t}</p>`).join('')}</section>`).join('')}
    <p class="help">如果画面仍是旧版，请在网址后加上 ?v=${NOTICE_LATEST.replace(/\./g, '')} 重新打开。</p>
    <div class="actions">${btn('notice-ok', '知道了', null, 'red')}${auto ? btn('notice-never', '以后不再弹出', null, 'ghost') : ''}</div></div>`);
}
function closeNotice(never){
  settings.noticeSeen = NOTICE_LATEST;
  if (never) settings.noticeNever = true;
  try { persist(); } catch (e) {}
  showTitle();
}
const _showTitleNotice = showTitle;
showTitle = function(...a){
  const r = _showTitleNotice(...a);
  try {
    const anchor = overlay.querySelector('[data-act="setup"]') || overlay.querySelector('[data-act="continue"]');
    if (anchor && !overlay.querySelector('[data-act="notice-open"]')) anchor.insertAdjacentHTML('afterend', btn('notice-open', '更新公告', null, 'ghost'));
    if (!settings.noticeSeen && !isVeteran()){ settings.noticeSeen = NOTICE_LATEST; try { persist(); } catch (e) {} return r; }
    const list = unseenNotices();
    if (list.length && !settings.noticeNever) showNotice(list, true);
  } catch (e) {}
  return r;
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act; if (!['notice-ok', 'notice-never', 'notice-open'].includes(a)) return;
  e.stopImmediatePropagation(); try { audioInit(); sfx('click'); } catch (err) {}
  if (a === 'notice-open') showNotice(NOTICES.slice(0, 3), false);
  else closeNotice(a === 'notice-never');
}, true);
