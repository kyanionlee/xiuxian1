<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>御剑问仙</title>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ebe3cd; --ink:#2b2620; --jade:#2e8467; --gold:#a97c22; --cinnabar:#b23a2a;
  --spirit:#2a8ea8; --stone:#7d756a; --violet:#6b4a8e; --panel:rgba(246,240,226,.96); --line:rgba(43,38,32,.2); --veil:rgba(235,227,205,.8);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161d26; --ink:#e7dfca; --jade:#72ccab; --gold:#e3bd62; --cinnabar:#e2614b;
    --spirit:#80d6ec; --stone:#9a9284; --violet:#b597dc; --panel:rgba(26,34,45,.97); --line:rgba(231,223,202,.2); --veil:rgba(22,29,38,.82);
  }
}
:root[data-theme="dark"]{
  --bg:#161d26; --ink:#e7dfca; --jade:#72ccab; --gold:#e3bd62; --cinnabar:#e2614b;
  --spirit:#80d6ec; --stone:#9a9284; --violet:#b597dc; --panel:rgba(26,34,45,.97); --line:rgba(231,223,202,.2); --veil:rgba(22,29,38,.82);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;touch-action:none}
[hidden]{display:none!important}
h1,h2,.card .glyph,.kai{font-family:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;font-weight:400}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none}
.xpbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--spirit)}
.row{display:flex;align-items:center;gap:12px;margin-top:8px}
#realm{font-size:24px;line-height:1}
#clock{margin-left:auto;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
#kills{font-size:14px;opacity:.75}
.round{pointer-events:auto;width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:50%;font:14px serif;cursor:pointer;flex:none}
#info{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px}
#info b{color:var(--gold)}
#mission{color:var(--cinnabar);font-weight:700}
#skills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-width:640px}
#skills span{font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
#skills span.evo{border-color:var(--gold);color:var(--gold)}
#skills span.p{opacity:.75}
#skills sub{font-size:10px;color:var(--gold);margin-left:2px;vertical-align:baseline}

#boss{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(440px,84vw);text-align:center;pointer-events:none}
#bossname{font-size:22px;color:var(--cinnabar)}
.bossbar{height:8px;border:1px solid var(--cinnabar);border-radius:2px;margin-top:4px}
.bossbar i{display:block;height:100%;background:var(--cinnabar)}

#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,8vw,56px);color:var(--cinnabar);pointer-events:none;opacity:0;padding:0 16px}
#banner.show{animation:ban 1.8s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.25)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}

.overlay{position:fixed;inset:0;display:flex;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
.panel{width:100%;max-width:720px;text-align:center;margin:auto}
h1{font-size:clamp(60px,15vw,112px);line-height:1;margin:0;letter-spacing:.06em;display:inline-flex;align-items:flex-start;gap:14px}
.seal{writing-mode:vertical-rl;font-size:18px;letter-spacing:.1em;background:var(--cinnabar);color:var(--bg);padding:8px 5px;border-radius:3px;transform:rotate(4deg);margin-top:10px;font-family:"Noto Serif SC",serif;font-weight:700}
h2{font-size:clamp(40px,9vw,64px);line-height:1.1;margin:0}
h3{font-size:16px;margin:24px 0 10px;text-align:left;font-weight:700}
.sub{font-size:18px;margin:14px 0 0}
.story{font-size:17px;line-height:1.9;max-width:28em;margin:18px auto 0;text-align:left}
.help{font-size:14px;line-height:1.8;opacity:.75;max-width:32em;margin:14px auto 0}
.pts{font-size:16px;margin-top:14px}
.pts b{font-size:22px;color:var(--gold);margin-left:4px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.vlist{display:flex;flex-direction:column;gap:10px;max-width:28em;margin:24px auto 0}
.vlist .btn{width:100%;text-align:left;letter-spacing:0;font-size:16px;line-height:1.5}
.vlist .btn small{display:block;font-weight:400;font-size:13px;opacity:.75}
.btn{font:700 18px "Noto Serif SC",serif;padding:12px 30px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:2px;cursor:pointer;letter-spacing:.08em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{font-size:14px;padding:7px 14px;letter-spacing:0;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.toggles{display:flex;gap:8px;justify-content:center;margin-top:18px}
.toggle{font:14px "Noto Serif SC",serif;padding:6px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:16px;cursor:pointer}
.toggle[aria-pressed="true"]{border-color:var(--jade);color:var(--jade)}
.btn:focus-visible,.card:focus-visible,.round:focus-visible,.toggle:focus-visible,.pickc:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.stats{display:flex;justify-content:center;gap:26px;margin-top:22px;flex-wrap:wrap}
.stats div{font-size:13px;opacity:.85}
.stats b{display:block;font-size:22px;margin-top:2px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 14px 20px;min-height:230px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;cursor:pointer;text-align:center}
.card::before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);opacity:.5;pointer-events:none}
.card.evo{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card .glyph{font-size:54px;line-height:1;color:var(--cinnabar)}
.card.evo .glyph{color:var(--gold)}
.card.cat-g .glyph{color:var(--spirit)}
.card.cat-p .glyph{color:var(--jade)}
.card .t{display:flex;flex-direction:column;gap:4px}
.card b{font-size:20px}
.card em{font-style:normal;font-size:13px;color:var(--gold)}
.card .d{font-size:14px;line-height:1.65;opacity:.8}
.card kbd{position:absolute;top:9px;right:11px;font:12px serif;opacity:.45}
@media (hover:hover){.card{transition:transform .15s}.card:hover{transform:translateY(-3px);border-color:var(--gold)}}
@media (pointer:coarse){.card kbd{display:none}}

.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;text-align:left}
.pickc{display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;cursor:pointer;text-align:left}
.pickc b{font-size:17px}
.pickc em{font-style:normal;font-size:12px;color:var(--gold)}
.pickc span{font-size:13px;opacity:.75;line-height:1.5}
.pickc[aria-pressed="true"]{border-color:var(--cinnabar);box-shadow:0 0 0 2px var(--cinnabar)}
.pickc:disabled{opacity:.4;cursor:default}

.mlist{display:flex;flex-direction:column;gap:8px;text-align:left}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
.mrow b{font-size:17px;margin-right:10px}
.pips{color:var(--gold);letter-spacing:2px;font-size:12px}
.mdesc{grid-column:1;font-size:13px;opacity:.75;line-height:1.5}
.mrow .btn{grid-row:1 / span 2;grid-column:2}

@media (max-width:560px){
  .cards{grid-template-columns:1fr;gap:10px}
  .card{flex-direction:row;min-height:0;text-align:left;padding:14px 18px;gap:16px}
  .card .glyph{font-size:42px;flex:none;width:48px;text-align:center}
}
@media (prefers-reduced-motion:reduce){#banner.show{animation-duration:2.2s}.card{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="xpbar"><i id="xpfill"></i></div>
  <div class="row">
    <span id="realm" class="kai"></span>
    <span id="clock">0:00</span>
    <span id="kills"></span>
    <button id="muteBtn" class="round" aria-label="声音开关">♪</button>
    <button id="pauseBtn" class="round" aria-label="暂停">❚❚</button>
  </div>
  <div id="info"><span>灵石 <b id="stones">0</b></span><span>机缘 <b id="luck">0</b></span><span id="mission"></span></div>
  <div id="skills"></div>
</div>
<div id="boss" hidden><div id="bossname" class="kai"></div><div class="bossbar"><i id="bossfill"></i></div></div>
<div id="banner" class="kai" aria-live="polite"></div>
<div id="overlay" class="overlay"></div>
<script>
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d'), overlay = $('overlay');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

const C = {};
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function readTheme(){
  const s = getComputedStyle(document.documentElement);
  for (const k of ['bg','ink','jade','gold','cinnabar','spirit','stone','violet']) C[k] = s.getPropertyValue('--' + k).trim();
  C.dark = darkMQ.matches;
  C.bone = '#f1eadb'; C.pale = '#a9bfa2';
}
readTheme(); darkMQ.addEventListener('change', readTheme);

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const d2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const fmt = t => { t = Math.floor(t); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
function hash(i, j){ const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return Math.abs(d); };

/* ========== 存档（轮回） ========== */
const META_KEY = 'yjwx-meta-v3';
let META = { pts:0, up:{}, sects:{ jian:true }, scenes:{ bamboo:true }, best:0, runs:0, wins:0, sfx:true, bgm:true, muted:false, lastSect:'jian', lastScene:'bamboo' };
try {
  const s = JSON.parse(localStorage.getItem(META_KEY) || 'null');
  if (s) META = Object.assign(META, s);
  else {
    const old = JSON.parse(localStorage.getItem('yjwx-meta-v2') || 'null');
    if (old){
      const refund = (old.unlock && old.unlock.fire ? 8 : 0) + (old.unlock && old.unlock.thunder ? 12 : 0) + (old.unlock && old.unlock.aura ? 12 : 0);
      Object.assign(META, { pts:(old.pts || 0) + refund, up:old.up || {}, best:old.best || 0, runs:old.runs || 0, wins:old.wins || 0,
        sfx:old.sfx !== false, bgm:old.bgm !== false, muted:!!old.muted });
    }
  }
} catch (e) {}
function saveMeta(){ try { localStorage.setItem(META_KEY, JSON.stringify(META)); } catch (e) {} }

const UPS = {
  hp:     { name:'根骨',     max:5, base:3,  eff:l => `初始气血 +${15 * l}` },
  atk:    { name:'灵根',     max:5, base:4,  eff:l => `所有伤害 +${6 * l}%` },
  spd:    { name:'轻身',     max:5, base:3,  eff:l => `移动速度 +${5 * l}%` },
  xp:     { name:'慧根',     max:5, base:3,  eff:l => `灵气获取 +${8 * l}%` },
  luck:   { name:'福缘',     max:5, base:4,  eff:l => `初始机缘 +${2 * l}` },
  pick:   { name:'聚气',     max:3, base:2,  eff:l => `拾取范围 +${15 * l}%` },
  regen:  { name:'长生',     max:3, base:5,  eff:l => `每秒回复气血 +${(0.3 * l).toFixed(1)}` },
  reroll: { name:'天命',     max:3, base:5,  eff:l => `突破时可重新推演 ${l} 次` },
  revive: { name:'神念推演', max:2, base:15, eff:l => `陨落后复生 ${l} 次` },
};
const upLv = k => META.up[k] || 0;
const upCost = k => UPS[k].base * (upLv(k) + 1);

/* ========== 宗门与秘境 ========== */
const SECTS = {
  jian:    { name:'青云剑宗', path:'剑修', start:'sword',  cost:0,  perk:'武器伤害 +15%，剑、枪、弓更易出现',
             apply(){ P.wMul += 0.15; }, fav:['sword','spear','bow'] },
  fu:      { name:'天符宗',   path:'法修', start:'fire',   cost:8,  perk:'功法冷却 -15%，灵气获取 +10%',
             apply(){ P.cdMul *= 0.85; P.xpMul += 0.1; }, fav:['fire','thunder','ice','meteor','wind'] },
  jingang: { name:'金刚寺',   path:'体修', start:'fist',   cost:12, perk:'气血 +60，受伤 -15%，气血越满伤害越高',
             apply(){ P.maxHp += 60; P.hp += 60; P.armor *= 0.85; P.regen += 0.5; P.speed *= 0.95; P.body = true; }, fav:['fist','staff','aura','wood'] },
  youming: { name:'幽冥宗',   path:'魂修', start:'banner', cost:15, perk:'斩妖积累魂力，伤害最多 +50%，击杀有几率回血',
             apply(){ P.maxHp -= 20; P.hp -= 20; P.soul = true; }, fav:['banner','drain','seal'] },
};
const SCENES = {
  bamboo:     { name:'青竹林',   cost:0,  mult:1,    hp:1,    tint:'jade',   ta:0.06, desc:'竹海幽深，小妖出没。适合初入修行。' },
  desert:     { name:'古战场',   cost:15, mult:1.35, hp:1.3,  tint:'gold',   ta:0.12, desc:'黄沙埋骨，阴兵不散。妖物更强，轮回点 ×1.35。' },
  underworld: { name:'幽冥鬼域', cost:25, mult:1.75, hp:1.7,  tint:'violet', ta:0.13, desc:'阴风不止，百鬼夜行。最为凶险，轮回点 ×1.75。' },
};
const ROSTER = {
  bamboo:     { chase:'imp',   fast:'wolf',   swarm:'bat',     tank:'golem',       ranged:'wisp',    elite:'tree',
                bosses:['bear','fox','demon'],        bossNames:['熊罴精','赤狐大妖','心魔'] },
  desert:     { chase:'skel',  fast:'scorp',  swarm:'vulture', tank:'armorcorpse', ranged:'archer',  elite:'general',
                bosses:['general','drought','demon'], bossNames:['骨魔将','旱魃','心魔'] },
  underworld: { chase:'ghost', fast:'hound',  swarm:'flame',   tank:'zombie',      ranged:'wuchang', elite:'bull',
                bosses:['horse','wuchang','demon'],   bossNames:['马面','黑白无常','鬼王'] },
};
const SKIN_NAME = { imp:'小妖', wolf:'狼妖', bat:'蝠妖', golem:'石傀', wisp:'狐火', tree:'树精', skel:'骷髅兵', scorp:'沙蝎',
  vulture:'秃鹫', armorcorpse:'铜甲尸', archer:'阴兵弓手', general:'将军尸', ghost:'游魂', hound:'恶鬼', flame:'鬼火', zombie:'僵尸',
  wuchang:'勾魂使', bull:'牛头' };
const BEH = {
  chase:  { r:10, hp:12,   spd:58,  dmg:8,  xp:1,  mass:1 },
  fast:   { r:10, hp:10,   spd:100, dmg:7,  xp:1,  mass:0.8 },
  swarm:  { r:8,  hp:7,    spd:125, dmg:5,  xp:1,  mass:0.5, wobble:true },
  tank:   { r:17, hp:70,   spd:38,  dmg:15, xp:4,  mass:3 },
  ranged: { r:9,  hp:22,   spd:70,  dmg:6,  xp:2,  mass:0.8, ranged:true },
  elite:  { r:24, hp:260,  spd:34,  dmg:18, xp:10, mass:8, elite:true },
  boss:   { r:34, hp:1100, spd:52,  dmg:25, xp:20, mass:20, boss:true },
};
const BOSS_AT = [120, 270, 420];
const WIN_AT = 480;

/* ========== 音效 ========== */
const SFX = { ctx:null, master:null, bgmGain:null, noise:null, last:{}, pickN:0 };
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
function audioInit(){
  if (SFX.ctx){ if (SFX.ctx.state === 'suspended') SFX.ctx.resume(); return; }
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const c = SFX.ctx = new A();
    SFX.master = c.createGain(); SFX.master.connect(c.destination);
    SFX.bgmGain = c.createGain(); SFX.bgmGain.gain.value = 0.4; SFX.bgmGain.connect(SFX.master);
    const b = c.createBuffer(1, c.sampleRate * 0.6, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    SFX.noise = b; applyMute();
  } catch (e) { SFX.ctx = null; }
}
function applyMute(){ if (SFX.master) SFX.master.gain.value = META.muted ? 0 : 0.5; $('muteBtn').textContent = META.muted ? '✕' : '♪'; }
function tone(f, dur, o = {}){
  const c = SFX.ctx, t = o.at || c.currentTime, osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f * o.slide), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + (o.attack || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(o.dest || SFX.master); osc.start(t); osc.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f, f2, at){
  const c = SFX.ctx, t = at || c.currentTime, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = SFX.noise; fl.type = ftype; fl.frequency.setValueAtTime(f, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(SFX.master); s.start(t); s.stop(t + dur);
}
const GAP = { hit:0.05, pick:0.035, kill:0.06, sword:0.07, fire:0.1, boom:0.09, thunder:0.1, shoot:0.15, punch:0.08, arrow:0.08, ice:0.12, wind:0.15, slam:0.12, swing:0.12, heal:0.3, stone:0.05 };
function sfx(name){
  if (!SFX.ctx || META.muted || !META.sfx) return;
  const now = SFX.ctx.currentTime;
  if (GAP[name] && now - (SFX.last[name] || 0) < GAP[name]) return;
  SFX.last[name] = now;
  switch (name){
    case 'hit': noise(0.05, 0.1, 'bandpass', 1800); break;
    case 'kill': tone(rand(420, 620), 0.09, { type:'triangle', vol:0.07, slide:0.5 }); break;
    case 'pick': SFX.pickN = (SFX.pickN + 1) % PENTA.length; tone(PENTA[SFX.pickN], 0.08, { vol:0.06 }); break;
    case 'stone': tone(1760, 0.06, { type:'triangle', vol:0.05 }); tone(2349, 0.08, { vol:0.04, at:now + 0.04 }); break;
    case 'sword': noise(0.14, 0.12, 'bandpass', 4000, 900); break;
    case 'punch': noise(0.08, 0.2, 'lowpass', 900, 200); tone(110, 0.1, { vol:0.15, slide:0.5 }); break;
    case 'swing': noise(0.25, 0.12, 'bandpass', 600, 2400); break;
    case 'arrow': tone(1200, 0.06, { type:'triangle', vol:0.05, slide:0.4 }); break;
    case 'ice': [0, 0.03].forEach(d => tone(2637 - d * 3000, 0.15, { vol:0.04, at:now + d })); break;

// 古筝风背景乐：每个秘境用不同调式
const BGM_SCALES = {
  bamboo:     { notes:[146.83,164.81,185,220,246.94,293.66,329.63,369.99,440,493.88,587.33,659.25], step:0.32, p:0.6, drone:73.42 },
  desert:     { notes:[110,130.81,146.83,164.81,196,220,261.63,293.66,329.63,392,440,523.25], step:0.4, p:0.55, drone:55 },
  underworld: { notes:[82.41,98,110,123.47,146.83,164.81,196,220,246.94,293.66,329.63], step:0.5, p:0.45, drone:41.2 },
};
const bgm = { next:0, idx:6, beat:0 };
function pluck(f, at, vol){
  tone(f * 1.012, 1.8, { type:'triangle', vol, at, dest:SFX.bgmGain, slide:0.988, attack:0.003 });
  tone(f * 2, 0.6, { vol:vol * 0.35, at, dest:SFX.bgmGain, attack:0.003 });
}
function bgmTick(){
  if (!SFX.ctx || META.muted || !META.bgm || state !== 'play') return;
  const c = SFX.ctx, sc = BGM_SCALES[P.scene], N = sc.notes;
  if (bgm.next < c.currentTime) bgm.next = c.currentTime + 0.05;
  while (bgm.next < c.currentTime + 0.3){
    const t = bgm.next;
    if (bgm.beat % 32 === 0) tone(sc.drone, 7, { vol:0.07, at:t, dest:SFX.bgmGain, attack:0.8 });
    if (bgm.beat % 16 === 8 && Math.random() < 0.4){
      for (let i = 0; i < 4; i++) pluck(N[Math.min(N.length - 1, bgm.idx + i)], t + i * 0.06, 0.06);
    } else if (Math.random() < sc.p){
      bgm.idx = Math.max(2, Math.min(N.length - 1, bgm.idx + pick([-2, -1, -1, 0, 1, 1, 2])));
      pluck(N[bgm.idx], t, 0.09);
      if (Math.random() < 0.15) pluck(N[bgm.idx] / 2, t, 0.06);
    }
    bgm.beat++; bgm.next += sc.step;
  }
}

const keys = {};

addEventListener('keydown', e => { keys[e.code] = true; onKey(e); });

cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  joy = { id:e.pointerId, ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY };
  cvs.setPointerCapture(e.pointerId);
});
cvs.addEventListener('pointermove', e => { if (joy && e.pointerId === joy.id){ joy.x = e.clientX; joy.y = e.clientY; } });
const endJoy = e => { if (joy && e.pointerId === joy.id) joy = null; };
cvs.addEventListener('pointerup', endJoy); cvs.addEventListener('pointercancel', endJoy);
function inputVec(){
  if (joy){
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
    if (d > 6){ const m = Math.min(1, d / 50); return { x:dx / d * m, y:dy / d * m }; }
  }
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x--; if (keys.KeyD || keys.ArrowRight) x++;
  if (keys.KeyW || keys.ArrowUp) y--; if (keys.KeyS || keys.ArrowDown) y++;
  const d = Math.hypot(x, y); return d ? { x:x / d, y:y / d } : { x:0, y:0 };
}

/* ========== 游戏状态 ========== */
let state = 'title', P = null;
let enemies = [], projs = [], orbs = [], fx = [], texts = [], swords = [], ebullets = [], zones = [], strikes = [], allies = [], marks = [], beams = [];
let time = 0, kills = 0, bossKills = 0, spawnAcc = 0, bossIdx = 0, pendingLv = 0, shake = 0, curOpts = [], mission = null;
const S = id => SK[id].stat(P.sk[id], !!P.evo[id]);

/* ========== 战斗基础 ========== */
function nearest(x, y, maxD, skip){
  let best = null, bd = maxD * maxD;
  for (const e of enemies){ if (e.dead || (skip && skip.has(e))) continue; const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd){ bd = d; best = e; } }
  return best;
}
function visible(){ return enemies.filter(e => !e.dead && Math.abs(e.x - P.x) < W / 2 + 20 && Math.abs(e.y - P.y) < H / 2 + 20); }
function dmgFactor(cat){
  let m = P.dmgMul * (cat === 'w' ? P.wMul : cat === 'g' ? P.gMul : 1);
  if (P.body) m *= 1 + 0.3 * (P.hp / P.maxHp);
  if (P.soul) m *= 1 + Math.min(0.5, P.soulKills * 0.0008);
  return m;
}
function hit(e, dmg, sx, sy, kb, cat, eff){
  if (e.dead) return;
  let d = dmg * dmgFactor(cat) * rand(0.9, 1.1), crit = false;
  if (Math.random() < Math.min(0.35, P.luck * 0.006)){ d *= 2; crit = true; }
  d = Math.max(1, Math.round(d));
  e.hp -= d; e.flash = 0.1;
  const dx = e.x - sx, dy = e.y - sy, m = Math.hypot(dx, dy) || 1, k = kb / e.mass;
  e.kx += dx / m * k; e.ky += dy / m * k;
  if (eff){
    if (eff.slow) e.slowT = Math.max(e.slowT, eff.slow);
    if (eff.stun) e.stunT = Math.max(e.stunT, e.boss ? eff.stun * 0.3 : eff.stun);
  }
  if (texts.length < 90) texts.push({ x:e.x + rand(-6, 6), y:e.y - e.r, v:d, t:0, crit });
  sfx('hit');
  if (e.hp <= 0) kill(e);
}
function aoe(x, y, r, dmg, kb, cat, eff){
  for (const e of enemies){ if (!e.dead && (e.x - x) ** 2 + (e.y - y) ** 2 < (r + e.r) ** 2) hit(e, dmg, x, y, kb, cat, eff); }
}
function cone(x, y, a, r, arc, dmg, kb, cat){
  for (const e of enemies){
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d < r + e.r && (d < e.r + 6 || angDiff(Math.atan2(dy, dx), a) < arc / 2 + e.r / Math.max(d, 1))) hit(e, dmg, x, y, kb, cat);
  }
}
function line(x, y, a, len, w, dmg, kb, cat){
  const ca = Math.cos(a), sa = Math.sin(a);
  for (const e of enemies){
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, al = dx * ca + dy * sa, pp = Math.abs(-dx * sa + dy * ca);
    if (al > -e.r && al < len + e.r && pp < w + e.r) hit(e, dmg, x, y, kb, cat);
  }
}
function kill(e){
  if (e.dead) return;
  e.dead = true; kills++; P.soulKills++; sfx('kill');
  if (mission && mission.k === 'kill') mission.prog++;
  if (P.soul && Math.random() < 0.04) P.hp = Math.min(P.maxHp, P.hp + 2);
  dropOrb(e.x, e.y, e.xp);
  if (Math.random() < 0.012 + P.luck * 0.0006) orbs.push({ x:e.x + rand(-8, 8), y:e.y + rand(-8, 8), stone:Math.ceil(rand(0, 3)) });
  if (!e.elite && !e.boss && Math.random() < 0.0012 + P.luck * 0.00015) orbs.push({ x:e.x, y:e.y, chest:true });
  if (e.elite){ orbs.push({ x:e.x, y:e.y, chest:true }); orbs.push({ x:e.x + 14, y:e.y, stone:10 }); }
  if (e.boss){
    bossKills++;
    for (let i = 0; i < 14; i++) dropOrb(e.x + rand(-40, 40), e.y + rand(-40, 40), 5);
    orbs.push({ x:e.x + 20, y:e.y, heal:40 }, { x:e.x - 20, y:e.y, chest:true }, { x:e.x, y:e.y + 20, stone:30 });
    banner(e.name + '伏诛');
  }
  if (fx.length < 400) for (let i = 0; i < 6; i++) fx.push({ k:'spark', x:e.x, y:e.y, vx:rand(-90, 90), vy:rand(-90, 90), t:0, dur:0.4 });
}
function dropOrb(x, y, v){
  if (orbs.length > 350){ const o = orbs[Math.floor(Math.random() * orbs.length)]; if (o.v){ o.v += v; return; } }
  orbs.push({ x, y, v });
}
function gainXp(v){
  P.xp += v * P.xpMul;
  while (P.xp >= P.xpNext){
    P.xp -= P.xpNext; P.lvl++; P.xpNext = need(P.lvl); pendingLv++;
    if ((P.lvl - 1) % 6 === 0) banner('突破！' + realmName(P.lvl));
  }
}
function hurt(d){
  if (P.inv > 0 || state !== 'play') return;
  d *= P.armor;
  P.hp -= d; P.inv = 0.45; shake = 6; sfx('hurt');
  if (mission && mission.k === 'guard'){ mission.prog += d; }
  if (P.hp <= 0){
    if (P.revives > 0) revive();
    else if (canBingjie()) openBingjie();
    else { P.hp = 0; gameOver(false); }
  }
}
function clearAround(r, bossPct){
  for (const e of enemies){
    if (e.dead) continue;
    const dd = d2(e, P);
    if (dd < r * r){
      if (e.boss){ e.hp -= e.maxHp * bossPct; const m = Math.sqrt(dd) || 1; e.kx += (e.x - P.x) / m * 600; e.ky += (e.y - P.y) / m * 600; if (e.hp <= 0) kill(e); }
      else kill(e);
    }
  }
  ebullets = [];
  fx.push({ k:'ring', x:P.x, y:P.y, r, t:0, dur:0.6 });
}
function revive(){
  P.revives--; P.hp = P.maxHp * 0.6; P.inv = 2.5;
  clearAround(320, 0);
  banner('神念推演，逆转生死'); sfx('evo'); updSkillsHud();
}
function canBingjie(){ return !P.bingjie && Object.keys(P.sk).some(k => SK[k].cat !== 'p' && P.sk[k] >= 3); }

/* —— 飞剑细节 —— */
function syncSwords(){
  if (!P.sk.sword){ swords = []; return; }
  const n = S('sword').n;
  while (swords.length < n) swords.push({ st:'orbit', x:P.x, y:P.y, vx:0, vy:0, life:0, pl:0, hits:new Set(), ang:0 });
}
function orbitPos(i, n, r){ const a = time * 2.6 + i * Math.PI * 2 / n; return { x:P.x + Math.cos(a) * r, y:P.y + Math.sin(a) * r, a }; }
function launch(w, t, s){
  const dx = t.x - w.x, dy = t.y - w.y, d = Math.hypot(dx, dy) || 1;
  w.st = 'fly'; w.vx = dx / d * 680; w.vy = dy / d * 680; w.life = 0.75; w.pl = s.pierce; w.hits.clear();
}
function updSwords(dt){
  const s = S('sword'), n = swords.length;
  if ((P.t.sword -= dt) <= 0){
    if (P.evo.sword){
      const idle = swords.filter(w => w.st === 'orbit');
      const targets = enemies.filter(e => !e.dead && d2(e, P) < 460 * 460).sort((a, b) => d2(a, P) - d2(b, P)).slice(0, idle.length);
      if (idle.length >= 4 && targets.length){ idle.forEach((w, i) => launch(w, targets[i % targets.length], s)); P.t.sword = s.cd * P.cdMul; sfx('sword'); }
      else P.t.sword = 0.1;
    } else {
      const w = swords.find(w => w.st === 'orbit'), t = nearest(P.x, P.y, 420);
      if (w && t){ launch(w, t, s); P.t.sword = s.cd * P.cdMul; sfx('sword'); } else P.t.sword = 0.1;
    }
  }
  swords.forEach((w, i) => {
    const o = orbitPos(i, n, s.orb);
    if (w.st === 'orbit'){
      const k = Math.min(1, dt * 18);
      w.x += (o.x - w.x) * k; w.y += (o.y - w.y) * k; w.ang = o.a + Math.PI / 2;
      for (const e of enemies){ if (!e.dead && e.swCd <= 0 && d2(w, e) < (e.r + 8) ** 2){ hit(e, s.dmg * 0.5, w.x, w.y, 90, 'w'); e.swCd = 0.35; } }
      for (const b of ebullets){ if (!b.dead && d2(w, b) < 196){ b.dead = true; fx.push({ k:'spark', x:b.x, y:b.y, vx:0, vy:0, t:0, dur:0.2 }); } }
    } else if (w.st === 'fly'){
      w.x += w.vx * dt; w.y += w.vy * dt; w.life -= dt; w.ang = Math.atan2(w.vy, w.vx);
      for (const e of enemies){
        if (e.dead || w.hits.has(e)) continue;
        if (d2(w, e) < (e.r + 9) ** 2){ w.hits.add(e); hit(e, s.dmg, w.x, w.y, 160, 'w'); if (--w.pl <= 0){ w.st = 'ret'; break; } }
      }
      if (w.life <= 0) w.st = 'ret';
    } else {
      const dx = o.x - w.x, dy = o.y - w.y, d = Math.hypot(dx, dy);
      if (d < 16) w.st = 'orbit';
      else { const sp = Math.min(800 * dt, d); w.x += dx / d * sp; w.y += dy / d * sp; w.ang = Math.atan2(dy, dx); }
    }
  });
}
function boltPts(x1, y1, x0, y0){
  if (x0 === undefined){ x0 = x1 + rand(-30, 30); y0 = y1 - H * 0.6; }
  const pts = [];
  for (let i = 0; i <= 9; i++){ const k = i / 9; pts.push([x0 + (x1 - x0) * k + (i && i < 9 ? rand(-12, 12) : 0), y0 + (y1 - y0) * k + (i && i < 9 ? rand(-6, 6) : 0)]); }
  return pts;
}
function explode(x, y, r, dmg, cat, burn){
  aoe(x, y, r, dmg, 140, cat);
  fx.push({ k:'boom', x, y, r, t:0, dur:0.35 }); sfx('boom');
  if (burn && zones.length < 30) zones.push({ x, y, r:r * 0.9, t:0, dur:2.5, tick:0, dmg:dmg * 0.3 });
}

/* ========== 刷怪 ========== */
function spawn(beh, x, y, extra){
  const t = BEH[beh], R0 = ROSTER[P.scene], sc = (1 + time / 60 * 0.45) * SCENES[P.scene].hp;
  if (x === undefined){
    const a = Math.random() * Math.PI * 2, R = Math.hypot(W, H) / 2 + 40;
    x = P.x + Math.cos(a) * R; y = P.y + Math.sin(a) * R;
  }
  const hp = t.hp * sc * (t.boss ? 1 + bossIdx * 0.7 : 1);
  const skin = t.boss ? R0.bosses[bossIdx] : R0[beh];
  const e = { beh, skin, name:t.boss ? R0.bossNames[bossIdx] : SKIN_NAME[skin], x, y, r:t.r, hp, maxHp:hp,
              spd:t.spd * (1 + time / 600 * 0.3), dmg:t.dmg * (0.8 + 0.2 * SCENES[P.scene].hp), xp:t.xp, mass:t.mass,
              boss:!!t.boss, elite:!!t.elite, ranged:!!t.ranged, wobble:!!t.wobble, kind:t.boss ? bossIdx : 0,
              kx:0, ky:0, flash:0, swCd:0, slowT:0, stunT:0, wob:Math.random() * 6, charge:0, cc:3, cdx:0, cdy:0, shot:rand(1, 2.6), summon:6 };
  Object.assign(e, extra || {});
  enemies.push(e);
  return e;
}
function updSpawn(dt){
  const crossed = p => Math.floor(time / p) !== Math.floor((time - dt) / p);
  if (crossed(60) && time > 5){
    const R = Math.hypot(W, H) / 2 + 30, n = 28 + Math.floor(time / 60) * 4, beh = time > 180 ? 'fast' : 'chase';
    for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2; spawn(beh, P.x + Math.cos(a) * R, P.y + Math.sin(a) * R); }
    banner('妖潮来袭'); sfx('drum');
  }
  if (crossed(90) && time > 5){ spawn('elite'); sfx('drum'); }
  if (bossIdx < BOSS_AT.length && time >= BOSS_AT[bossIdx]){
    const e = spawn('boss'); banner(e.name + '现身'); sfx('boss'); bossIdx++;
  }
  spawnAcc += Math.min(14, 1.3 + time / 22) * dt;
  while (spawnAcc >= 1){
    spawnAcc--;
    if (enemies.length >= 340){ spawnAcc = 0; break; }
    const r = Math.random();
    if (time > 60 && r < 0.12){
      const a = Math.random() * Math.PI * 2, R = Math.hypot(W, H) / 2 + 40;
      for (let i = 0; i < 4; i++) spawn('swarm', P.x + Math.cos(a) * R + rand(-20, 20), P.y + Math.sin(a) * R + rand(-20, 20));
      continue;
    }
    let beh = 'chase';
    if (time > 40 && r < 0.4) beh = 'fast';
    if (time > 100 && r > 0.88) beh = 'tank';
    if (time > 150 && r > 0.8 && r <= 0.88) beh = 'ranged';
    spawn(beh);
  }
}

/* ========== 妖物行为 ========== */
function shoot(e, ang, spd, dmg){ ebullets.push({ x:e.x, y:e.y, vx:Math.cos(ang) * spd, vy:Math.sin(ang) * spd, life:4, dmg, r:5 }); }
function updEnemies(dt){
  const far = Math.hypot(W, H) * 0.75, R = Math.hypot(W, H) / 2 + 40, damp = Math.exp(-dt * 8);
  for (const e of enemies){
    if (e.dead) continue;
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1, toP = Math.atan2(dy, dx);
    e.flash = Math.max(0, e.flash - dt); e.swCd -= dt; e.slowT -= dt;
    if (e.stunT > 0){
      e.stunT -= dt;
    } else {
      let mx = dx / d, my = dy / d, sp = e.spd * (e.slowT > 0 ? 0.5 : 1);
      if (e.wobble){ const w = Math.sin(time * 6 + e.wob) * 0.8, nx = mx - my * w, ny = my + mx * w, m = Math.hypot(nx, ny); mx = nx / m; my = ny / m; }
      if (e.ranged){
        if (d < 170){ mx = -mx; my = -my; } else if (d < 240){ const tx = -my; my = mx; mx = tx; sp *= 0.6; }
        e.shot -= dt;
        if (e.shot <= 0 && d < 420){ e.shot = 2.6; shoot(e, toP, 170, 10); sfx('shoot'); }
      }
      if (e.boss){
        e.cc -= dt;
        if (e.charge > 0){ e.charge -= dt; sp = e.spd * 4.5; mx = e.cdx; my = e.cdy; }
        else if (e.cc <= 0){ e.charge = 0.7; e.cc = e.kind === 2 ? 5 : 4; e.cdx = mx; e.cdy = my; }
        if (e.kind >= 1){
          e.shot -= dt;
          if (e.shot <= 0){
            if (e.kind === 1){ e.shot = 2.5; for (let i = -2; i <= 2; i++) shoot(e, toP + i * 0.22, 190, 12); }
            else { e.shot = 3; const off = Math.random() * 6; for (let i = 0; i < 14; i++) shoot(e, off + i / 14 * Math.PI * 2, 160, 12); }
            sfx('shoot');
          }
        }
        if (e.kind === 2){ e.summon -= dt; if (e.summon <= 0){ e.summon = 8; for (let i = 0; i < 6; i++) spawn('swarm', e.x + rand(-40, 40), e.y + rand(-40, 40)); } }
      }
      e.x += mx * sp * dt; e.y += my * sp * dt;
    }
    e.x += e.kx * dt; e.y += e.ky * dt; e.kx *= damp; e.ky *= damp;
    if (d < e.r + P.r) hurt(e.dmg);
    if (d > far && !e.boss && !e.elite){ e.x = P.x + dx / d * R; e.y = P.y + dy / d * R; }
  }
}
function separate(){
  const cs = 32, g = new Map();
  for (const e of enemies){ if (e.dead) continue; const k = Math.floor(e.x / cs) + ',' + Math.floor(e.y / cs); let a = g.get(k); if (!a) g.set(k, a = []); a.push(e); }
  for (const e of enemies){
    if (e.dead) continue;
    const cx = Math.floor(e.x / cs), cy = Math.floor(e.y / cs);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++){
      const a = g.get((cx + i) + ',' + (cy + j)); if (!a) continue;
      for (const o of a){
        if (o === e) continue;
        const dx = e.x - o.x, dy = e.y - o.y, dd = dx * dx + dy * dy, rr = e.r + o.r;
        if (dd < rr * rr && dd > 0.01){ const dist = Math.sqrt(dd), p = (rr - dist) * 0.5 * (o.mass / (e.mass + o.mass)); e.x += dx / dist * p; e.y += dy / dist * p; }
      }
    }
  }
}

/* ========== 投射物、天降、火海、召唤物 ========== */
function updProjs(dt){
  for (const p of projs){
    if (p.k === 'wind'){ p.rad += p.vr * dt; p.ang += p.va * dt; p.x = P.x + Math.cos(p.ang) * p.rad; p.y = P.y + Math.sin(p.ang) * p.rad; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; }
    p.life -= dt; p.spin += dt * 8;
    if (p.life <= 0){ p.dead = true; if (p.boom) explode(p.x, p.y, p.boom, p.dmg, p.cat, p.burn); continue; }
    for (const e of enemies){
      if (e.dead || p.hits.has(e)) continue;
      if (d2(p, e) < (e.r + p.r) ** 2){
        if (p.boom){ p.dead = true; explode(p.x, p.y, p.boom, p.dmg, p.cat, p.burn); break; }
        p.hits.add(e); hit(e, p.dmg, p.x, p.y, p.kb, p.cat, p.eff);
        if (--p.pierce <= 0){ p.dead = true; break; }
      }
    }
  }
  projs = projs.filter(p => !p.dead);
  for (const s of strikes){
    s.t += dt;
    if (s.t >= s.delay){
      s.dead = true;
      aoe(s.x, s.y, s.r, s.dmg, 120, s.cat, s.stun ? { stun:s.stun } : null);
      fx.push({ k:s.k === 'seal' ? 'slam' : 'boom', x:s.x, y:s.y, r:s.r, t:0, dur:0.4 });
      shake = Math.max(shake, s.k === 'seal' ? 8 : 4); sfx(s.k === 'seal' ? 'slam' : 'boom');
      if (s.burn && zones.length < 30) zones.push({ x:s.x, y:s.y, r:s.r * 0.9, t:0, dur:3, tick:0, dmg:s.dmg * 0.25 });
    }
  }
  strikes = strikes.filter(s => !s.dead);
  for (const z of zones){
    z.t += dt; z.tick -= dt;
    if (z.tick <= 0){ z.tick = 0.35; aoe(z.x, z.y, z.r, z.dmg, 10, 'g'); }
  }
  zones = zones.filter(z => z.t < z.dur);
}
function updAllies(dt){
  const bs = P.sk.banner ? S('banner') : null, n = bs ? bs.n : 0;
  let ghosts = allies.filter(a => a.k === 'ghost');
  if (ghosts.length > n){ allies = allies.filter(a => a.k !== 'ghost'); ghosts = []; }
  while (ghosts.length < n){ const a = { k:'ghost', x:P.x + rand(-20, 20), y:P.y + rand(-20, 20), cd:0, wob:Math.random() * 6 }; allies.push(a); ghosts.push(a); }
  if (P.pet && !allies.some(a => a.k === 'pet')) allies.push({ k:'pet', x:P.x, y:P.y, cd:0, wob:0 });
  for (const a of allies){
    const ghost = a.k === 'ghost', dmg = ghost ? bs.dmg : 10 + P.lvl * 2.5, spd = ghost ? bs.spd : 210;
    a.cd -= dt;
    let t = a.tgt;
    if (!t || t.dead || d2(t, P) > 420 * 420) t = a.tgt = nearest(a.x, a.y, 320);
    let tx, ty;
    if (t){ tx = t.x; ty = t.y; } else { const ang = time * 1.5 + a.wob; tx = P.x + Math.cos(ang) * 50; ty = P.y + Math.sin(ang) * 50; }
    const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy) || 1, m = Math.min(d, spd * dt);
    a.x += dx / d * m; a.y += dy / d * m; a.face = Math.atan2(dy, dx);
    if (t && d < t.r + 10 && a.cd <= 0){
      a.cd = ghost ? 0.5 : 0.7;
      if (ghost && P.evo.banner) aoe(a.x, a.y, 40, dmg, 40, 'w'); else hit(t, dmg, a.x, a.y, 60, 'w');
    }
    if (d2(a, P) > 500 * 500){ a.x = P.x; a.y = P.y; }
  }
}
function updBullets(dt){
  for (const b of ebullets){
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) b.dead = true;
    else if (d2(b, P) < (b.r + P.r - 2) ** 2){ b.dead = true; hurt(b.dmg); }
  }
  ebullets = ebullets.filter(b => !b.dead);
}
function updOrbs(dt){
  for (const o of orbs){
    const dx = P.x - o.x, dy = P.y - o.y, d = Math.hypot(dx, dy);
    if (o.mag || d < P.pick){
      o.mag = true; o.sp = (o.sp || 150) + 900 * dt;
      const m = Math.min(o.sp * dt, d); if (d > 0){ o.x += dx / d * m; o.y += dy / d * m; }
    }
    if (d < P.r + 8){
      o.dead = true;
      if (o.heal){ P.hp = Math.min(P.maxHp, P.hp + o.heal); texts.push({ x:P.x, y:P.y - 20, v:'+' + o.heal, t:0, heal:true }); sfx('heal'); }
      else if (o.chest){ pendingLv++; banner('获得机缘'); sfx('chest'); }
      else if (o.stone){ P.stones += o.stone; sfx('stone'); }
      else { gainXp(o.v); sfx('pick'); }
    }
  }
  orbs = orbs.filter(o => !o.dead);
}
function updFx(dt){
  for (const f of fx){ f.t += dt; if (f.k === 'spark'){ f.x += f.vx * dt; f.y += f.vy * dt; } }
  fx = fx.filter(f => f.t < f.dur);
  for (const t of texts) t.t += dt;
  texts = texts.filter(t => t.t < 0.7);
}

/* ========== 奇遇标记与宗门任务 ========== */
function updMarks(dt){
  P.evT -= dt;
  if (P.evT <= 0){
    P.evT = Math.max(16, rand(36, 50) - P.luck * 0.6);
    if (marks.length < 2){ const a = Math.random() * Math.PI * 2, R = rand(260, 420); marks.push({ x:P.x + Math.cos(a) * R, y:P.y + Math.sin(a) * R, life:45 }); }
  }
  for (const m of marks){
    m.life -= dt;
    if (m.life <= 0) m.dead = true;
    else if (d2(m, P) < 30 * 30 && state === 'play'){ m.dead = true; openEvent(); break; }
  }
  marks = marks.filter(m => !m.dead);
}
function updMission(dt){
  if (!mission){
    P.misT -= dt;
    if (P.misT <= 0){
      const k = pick(['kill', 'seek', 'guard']), sect = SECTS[P.sect].name;
      if (k === 'kill') mission = { k, title:'斩妖令', need:Math.floor(50 + time / 3), prog:0, until:time + 60 };
      if (k === 'seek'){ const a = Math.random() * Math.PI * 2; mission = { k, title:'寻宝令', x:P.x + Math.cos(a) * 650, y:P.y + Math.sin(a) * 650, until:time + 45 }; }
      if (k === 'guard') mission = { k, title:'护法令', need:40, prog:0, until:time + 45 };
      banner(sect + '·' + mission.title); sfx('drum');
    }
    return;
  }
  const m = mission;
  let done = false, fail = false;
  if (m.k === 'kill'){ if (m.prog >= m.need) done = true; else if (time > m.until) fail = true; }
  if (m.k === 'seek'){ if (d2(m, P) < 40 * 40) done = true; else if (time > m.until) fail = true; }
  if (m.k === 'guard'){ if (m.prog > m.need) fail = true; else if (time > m.until) done = true; }
  if (done){
    orbs.push({ x:P.x + 20, y:P.y, chest:true }); P.stones += 30; P.luck += 1;
    banner('宗门嘉奖'); sfx('chest'); mission = null; P.misT = 100;
  } else if (fail){ banner('任务失败'); mission = null; P.misT = 100; }
}
function missionText(){
  if (!mission) return '';
  const left = Math.max(0, Math.ceil(mission.until - time));
  if (mission.k === 'kill') return `${mission.title}：斩妖 ${mission.prog}/${mission.need}（${left}秒）`;
  if (mission.k === 'seek') return `${mission.title}：寻得宗门遗宝（${left}秒）`;
  return `${mission.title}：受伤不超过 ${mission.need}，已受 ${Math.round(mission.prog)}（${left}秒）`;
}

/* ========== 主更新 ========== */
function update(dt){
  time += dt;
  const v = inputVec();
  P.x += v.x * P.speed * dt; P.y += v.y * P.speed * dt;
  if (v.x || v.y){ P.walk += dt; P.faceA = Math.atan2(v.y, v.x); }
  P.inv = Math.max(0, P.inv - dt);
  if (!P.noRegen) P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  shake = Math.max(0, shake - dt * 30);
  updSpawn(dt); updEnemies(dt); separate(); updBullets(dt);
  for (const k of Object.keys(P.sk)){ const s = SK[k]; if (s.upd && state === 'play') s.upd(dt, S(k)); }
  if (!P.sk.drain) beams = [];
  updAllies(dt); updProjs(dt); updOrbs(dt); updFx(dt); updWeather(dt);
  enemies = enemies.filter(e => !e.dead);
  if (state !== 'play') return;
  updMission(dt); updMarks(dt);
  if (state !== 'play') return;
  if (time >= WIN_AT){ gameOver(true); return; }
  hud();
  if (pendingLv > 0) openLevelUp();
}

/* ========== 天气粒子 ========== */
let weather = [];
function initWeather(){ weather = []; for (let i = 0; i < 45; i++) weather.push(newParticle(true)); }
function newParticle(init){
  const sc = P ? P.scene : 'bamboo';
  const p = { x:rand(0, W), y:init ? rand(0, H) : -10, a:rand(0, 6), s:rand(0.6, 1.2) };
  if (sc === 'desert'){ p.x = init ? rand(0, W) : -20; p.y = rand(0, H); }
  if (sc === 'underworld'){ p.y = init ? rand(0, H) : H + 10; }
  return p;
}
function updWeather(dt){
  const sc = P ? P.scene : 'bamboo';
  for (let i = 0; i < weather.length; i++){
    const p = weather[i];
    if (sc === 'bamboo'){ p.x += (-20 + Math.sin(time + i) * 15) * dt * p.s; p.y += 30 * dt * p.s; p.a += dt * 2; }
    else if (sc === 'desert'){ p.x += 260 * dt * p.s; p.y += Math.sin(time * 2 + i) * 10 * dt; }
    else { p.y -= 22 * dt * p.s; p.x += Math.sin(time * 1.5 + i) * 12 * dt; }
    if (p.y > H + 20 || p.x < -30 || p.x > W + 30 || p.y < -20) weather[i] = newParticle(false);
  }
}
function drawWeather(){
  const c = ctx, sc = P ? P.scene : 'bamboo';
  for (const p of weather){
    if (sc === 'bamboo'){
      c.globalAlpha = 0.45; c.fillStyle = C.jade; c.save(); c.translate(p.x, p.y); c.rotate(p.a);
      c.beginPath(); c.ellipse(0, 0, 6 * p.s, 2 * p.s, 0, 0, 7); c.fill(); c.restore();
    } else if (sc === 'desert'){
      c.globalAlpha = 0.3; c.strokeStyle = C.gold; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - 18 * p.s, p.y); c.stroke();
    } else {
      c.globalAlpha = 0.35 + 0.25 * Math.sin(time * 3 + p.a); c.fillStyle = p.a > 3 ? C.spirit : C.violet;
      c.beginPath(); c.arc(p.x, p.y, 2.2 * p.s, 0, 7); c.fill();
    }
  }
  c.globalAlpha = 1;
}

/* ========== 地面 ========== */
function drawGround(cx, cy, sceneK){
  const c = ctx, sc = SCENES[sceneK], g = 110;
  c.globalAlpha = sc.ta; c.fillStyle = C[sc.tint]; c.fillRect(cx, cy, W, H); c.globalAlpha = 1;
  const x0 = Math.floor(cx / g) - 1, y0 = Math.floor(cy / g) - 1, x1 = Math.ceil((cx + W) / g) + 1, y1 = Math.ceil((cy + H) / g) + 2;
  c.lineCap = 'round';
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++){
    const h = hash(i, j), h2 = hash(j + 7, i - 3), x = i * g + h * 70, y = j * g + h2 * 70;
    if (sceneK === 'bamboo') groundBamboo(x, y, h, h2);
    else if (sceneK === 'desert') groundDesert(x, y, h, h2);
    else groundUnder(x, y, h, h2);
  }
  c.globalAlpha = 1;
}
function tuft(x, y, a){
  const c = ctx; c.globalAlpha = a; c.strokeStyle = C.ink; c.lineWidth = 1.2; c.beginPath();
  c.moveTo(x - 4, y); c.lineTo(x - 7, y - 7); c.moveTo(x, y); c.lineTo(x, y - 10); c.moveTo(x + 4, y); c.lineTo(x + 7, y - 6); c.stroke();
}
function groundBamboo(x, y, h, h2){
  const c = ctx;
  if (h < 0.3) tuft(x, y, 0.16);
  else if (h < 0.38){ c.globalAlpha = 0.1; c.fillStyle = C.ink; c.beginPath(); c.ellipse(x, y, 10, 6, 0, 0, 7); c.fill(); }
  else if (h < 0.5){
    for (let k = 0; k < 3; k++){
      const sx = x + k * 8 - 8 + h2 * 4, ht = 60 + ((h2 * 13 + k * 0.37) % 1) * 50, lean = (h2 - 0.5) * 8;
      c.globalAlpha = 0.42; c.strokeStyle = C.jade; c.lineWidth = 3.5;
      c.beginPath(); c.moveTo(sx, y); c.lineTo(sx + lean, y - ht); c.stroke();
      c.globalAlpha = 0.5; c.strokeStyle = C.ink; c.lineWidth = 1;
      for (let n = 18; n < ht; n += 18){ const nx = sx + lean * n / ht; c.beginPath(); c.moveTo(nx - 2.5, y - n); c.lineTo(nx + 2.5, y - n); c.stroke(); }
      c.globalAlpha = 0.4; c.fillStyle = C.jade;
      for (let l = 0; l < 3; l++){
        const lx = sx + lean, ly = y - ht + l * 10, a = (l % 2 ? 0.5 : -0.5) + Math.sin(time * 1.5 + h * 9 + l) * 0.08;
        c.save(); c.translate(lx, ly); c.rotate(a); c.beginPath(); c.ellipse(l % 2 ? 9 : -9, 0, 10, 2.4, 0, 0, 7); c.fill(); c.restore();
      }
    }
  } else if (h < 0.53){
    c.globalAlpha = 0.18; c.fillStyle = C.spirit; c.beginPath(); c.ellipse(x, y, 34, 14, 0, 0, 7); c.fill();
    c.globalAlpha = 0.3; c.fillStyle = C.jade; c.beginPath(); c.ellipse(x + 10, y - 2, 6, 3, 0, 0, 7); c.fill();
  }
}
function groundDesert(x, y, h, h2){
  const c = ctx;
  if (h < 0.28){ c.globalAlpha = 0.2; c.strokeStyle = C.gold; c.lineWidth = 1.5; c.beginPath(); c.arc(x, y + 20, 40, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); }
  else if (h < 0.35){
    c.globalAlpha = 0.45; c.strokeStyle = C.bone; c.lineWidth = 3;
    c.beginPath(); c.moveTo(x - 9, y - 4); c.lineTo(x + 9, y + 4); c.moveTo(x - 9, y + 4); c.lineTo(x + 9, y - 4); c.stroke();
    c.fillStyle = C.bone; c.beginPath(); c.arc(x + 14, y - 2, 5, 0, 7); c.fill();
    c.globalAlpha = 0.5; c.fillStyle = C.ink; c.fillRect(x + 12, y - 3, 1.5, 1.5); c.fillRect(x + 15, y - 3, 1.5, 1.5);
  } else if (h < 0.42){
    const a = (h2 - 0.5) * 0.6;
    c.save(); c.translate(x, y); c.rotate(a); c.globalAlpha = 0.5;
    c.fillStyle = C.stone; c.beginPath(); c.moveTo(-2, 0); c.lineTo(2, 0); c.lineTo(1.5, -26); c.lineTo(-1.5, -22); c.closePath(); c.fill();
    c.fillStyle = C.ink; c.fillRect(-6, -28, 12, 2.5); c.fillRect(-1.2, -36, 2.4, 8);
    c.restore();
    c.globalAlpha = 0.15; c.fillStyle = C.ink; c.beginPath(); c.ellipse(x, y + 1, 7, 2, 0, 0, 7); c.fill();
  } else if (h < 0.5){
    c.globalAlpha = 0.18; c.strokeStyle = C.ink; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x - 20, y); c.lineTo(x - 6, y + 3); c.lineTo(x + 4, y - 4); c.lineTo(x + 18, y + 2); c.moveTo(x - 6, y + 3); c.lineTo(x - 4, y + 12); c.stroke();
  } else if (h < 0.53){
    c.globalAlpha = 0.35; c.fillStyle = C.cinnabar; c.fillRect(x - 1, y - 40, 2, 40);
    c.beginPath(); c.moveTo(x + 1, y - 40); c.lineTo(x + 22 + Math.sin(time * 4 + h) * 3, y - 34); c.lineTo(x + 1, y - 28); c.fill();
  }
}
function groundUnder(x, y, h, h2){
  const c = ctx;
  if (h < 0.18){
    c.globalAlpha = 0.35; c.fillStyle = C.stone;
    c.beginPath(); c.moveTo(x - 9, y); c.lineTo(x - 9, y - 16); c.arc(x, y - 16, 9, Math.PI, 0); c.lineTo(x + 9, y); c.closePath(); c.fill();
    c.globalAlpha = 0.4; c.strokeStyle = C.ink; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y - 20); c.lineTo(x, y - 8); c.moveTo(x - 4, y - 16); c.lineTo(x + 4, y - 16); c.stroke();
  } else if (h < 0.25){
    c.globalAlpha = 0.5; c.strokeStyle = C.ink; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 28); c.lineTo(x + 8, y - 28); c.stroke();
    const f = Math.sin(time * 6 + h * 20) * 1.5;
    c.globalAlpha = 0.25; c.fillStyle = C.spirit; c.beginPath(); c.arc(x + 8, y - 22, 9 + f, 0, 7); c.fill();
    c.globalAlpha = 0.8; c.beginPath(); c.ellipse(x + 8, y - 22, 3, 5 + f * 0.5, 0, 0, 7); c.fill();
  } else if (h < 0.33){
    c.globalAlpha = 0.35; c.fillStyle = C.gold;
    for (let k = 0; k < 3; k++){ const px = x + (hash(k, h * 9) - 0.5) * 40, py = y + (hash(h * 9, k) - 0.5) * 20; c.beginPath(); c.arc(px, py, 4, 0, 7); c.fill(); c.fillStyle = C.bg; c.fillRect(px - 1.2, py - 1.2, 2.4, 2.4); c.fillStyle = C.gold; }
  } else if (h < 0.4){
    c.globalAlpha = 0.3; c.strokeStyle = C.ink; c.lineWidth = 2;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + 2, y - 30); c.lineTo(x - 10, y - 44); c.moveTo(x + 2, y - 30); c.lineTo(x + 14, y - 40); c.lineTo(x + 18, y - 52); c.stroke();
  } else if (h < 0.5) tuft(x, y, 0.1);
}

function eyes(x, y, r, size, col){ const c = ctx; c.fillStyle = col; c.beginPath(); c.arc(x - r * 0.32, y - r * 0.1, size, 0, 7); c.arc(x + r * 0.32, y - r * 0.1, size, 0, 7); c.fill(); }
function horns(x, y, r, col){
  const c = ctx, hr = r * 0.55; c.fillStyle = col;

  c.beginPath(); c.moveTo(x + hr, y - r * 0.7); c.lineTo(x + hr * 0.6, y - r * 1.35); c.lineTo(x + hr * 0.15, y - r * 0.85); c.fill();
}
function humanoid(x, y, r, o, face, wob){

  c.beginPath();
  if (o.armsFwd){ c.moveTo(x - r * 0.4, y - r * 0.3); c.lineTo(x - r * 0.4 + fxv * r * 1.2, y - r * 0.3 + fyv * r * 0.5); c.moveTo(x + r * 0.4, y - r * 0.3); c.lineTo(x + r * 0.4 + fxv * r * 1.2, y - r * 0.3 + fyv * r * 0.5); }
  else { c.moveTo(x - r * 0.5, y - r * 0.3); c.lineTo(x - r * 0.75, y + r * 0.3 - st * 0.5); c.moveTo(x + r * 0.5, y - r * 0.3); c.lineTo(x + r * 0.75, y + r * 0.3 + st * 0.5); }
  c.stroke();
  c.fillStyle = o.body; c.strokeStyle = C.ink; c.lineWidth = 1;

    { label:'炼化雷力', note:'看机缘', run(){ if (roll(0.45)) return '你引雷入体，悟出雷法：' + grant(['g'], 1, 'thunder') + '。'; hpCost(35); return '雷力暴走，将你劈得焦黑。气血 -35。'; } },
    { label:'绕道而行', run(){ return '你小心避开了雷区。'; } } ] },
  { id:'remnant', title:'古修残魂', text:'一缕残魂飘到你面前：“吾愿以毕生所学，换你一滴精血。”', opts:[
    { label:'献出精血', note:'气血上限 -20', run(){ P.maxHp = Math.max(40, P.maxHp - 20); P.hp = Math.min(P.hp, P.maxHp); return '残魂兑现了承诺：' + grant(['w','g'], 2) + '。'; } },
    { label:'以幡收魂', note:'需持有招魂幡', req:() => !!P.sk.banner, run(){ return '残魂被收入幡中：' + grant(['w'], 2, 'banner') + '。'; } },
    { label:'婉拒', run(){ P.luck += 1; return '残魂叹息一声，消散在风中。机缘 +1。'; } } ] },
  { id:'elder', title:'宗门前辈', text:'一位宗门前辈路过，见你修行刻苦，驻足指点。', opts:[
    { label:'虚心请教', run(){ P.stones += 30; return '前辈倾囊相授：' + grant(['w','g'], 1, SECTS[P.sect].start) + '。另赠灵石 30。'; } } ] },
  { id:'gamble', title:'赌石摊', text:'集市上有人赌石，一块原石二十灵石，切开看命。', repeat:true, opts:[
    { label:'赌一块', note:'灵石 20', req:() => P.stones >= 20, run(){ P.stones -= 20; if (roll(0.12)) return '切出一块灵玉，炼成法宝：' + upgradeOwned(2) + '！'; if (roll(0.3)){ P.stones += 45; return '切出了灵石矿。灵石 +45。'; } return '一刀穷。'; } },
    { label:'看看就走', run(){ return '你看了几刀热闹，转身离开。'; } } ] },
  { id:'inner', title:'心魔试炼', text:'打坐时，心魔幻化成你的模样，冷冷看着你。', opts:[
    { label:'迎战心魔', note:'看机缘', run(){ if (roll(0.4 + P.lvl * 0.01)){ P.maxHp += 20; P.hp += 20; P.dmgMul += 0.06; return '你斩破心魔，道心更坚。气血上限 +20，伤害 +6%。'; } hpCost(40); return '心魔反噬，你吐出一口鲜血。气血 -40。'; } },
    { label:'静心守一', run(){ P.hp = Math.min(P.maxHp, P.hp + 20); return '你稳住心神，心魔渐渐散去。气血 +20。'; } } ] },
  { id:'egg', title:'灵兽蛋', text:'草丛里有一枚温热的蛋，蛋壳上有灵纹流动。', opts:[
    { label:'以灵石孵化', note:'灵石 15', req:() => P.stones >= 15 && !P.pet, run(){ P.stones -= 15; P.pet = true; return '一只小灵狐破壳而出，从此跟随你左右，会自动撕咬妖物。'; } },
    { label:'炖汤', run(){ P.hp = Math.min(P.maxHp, P.hp + 30); P.maxHp += 10; return '鲜美无比。气血 +30，气血上限 +10。'; } } ] },
];
let curEvent = null;
function openEvent(){
  const pool = EVENTS.filter(e => e.repeat || !P.seen.has(e.id));
  curEvent = pick(pool.length ? pool : EVENTS); P.seen.add(curEvent.id);
  state = 'event'; joy = null; sfx('event');
  const btns = curEvent.opts.map((o, i) => {
    const ok = !o.req || o.req();
    return `<button class="btn ghost" data-act="evopt" data-i="${i}" ${ok ? '' : 'disabled'}>${o.label}${o.note ? `<small>${o.note}${ok ? '' : '（条件不足）'}</small>` : ''}</button>`;
  }).join('');
  showOverlay(`<div class="panel"><h2>${curEvent.title}</h2><p class="story">${curEvent.text}</p>
    <p class="help">机缘 ${P.luck}，灵石 ${P.stones}</p><div class="vlist">${btns}</div></div>`);
}
function chooseEvent(i){
  const o = curEvent && curEvent.opts[i]; if (!o || (o.req && !o.req())) return;
  const res = o.run(); curEvent = null; updSkillsHud();
  showOverlay(`<div class="panel"><h2>机缘</h2><p class="story">${res}</p><div class="actions"><button class="btn" data-act="evdone">继续修行</button></div></div>`);
}

/* ========== 界面 ========== */
const hudCache = {};
function setText(id, t){ if (hudCache[id] !== t){ hudCache[id] = t; $(id).textContent = t; } }
function hud(){
  setText('realm', realmName(P.lvl)); setText('clock', fmt(time)); setText('kills', '斩妖 ' + kills);
  setText('stones', String(P.stones)); setText('luck', String(P.luck)); setText('mission', missionText());
  $('xpfill').style.width = (P.xp / P.xpNext * 100).toFixed(1) + '%';
  const b = enemies.find(e => e.boss && !e.dead);
  if (b){ $('boss').hidden = false; setText('bossname', b.name); $('bossfill').style.width = Math.max(0, b.hp / b.maxHp * 100) + '%'; }
  else $('boss').hidden = true;
}
function updSkillsHud(){
  if (!P) return;
  const ks = Object.keys(P.sk).sort((a, b) => (SK[a].cat === 'p') - (SK[b].cat === 'p'));
  $('skills').innerHTML = ks.map(k => P.evo[k] ? `<span class="evo">${SK[k].evo.name}</span>`
    : `<span class="${SK[k].cat === 'p' ? 'p' : ''}">${SK[k].name}<sub>${P.sk[k]}</sub></span>`).join('')
    + (P.pet ? '<span>灵狐</span>' : '') + (P.revives ? `<span>复生<sub>${P.revives}</sub></span>` : '') + (P.noRegen ? '<span class="evo">入魔</span>' : '');
}
function banner(t){ const b = $('banner'); b.textContent = t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
function showOverlay(html){
  overlay.innerHTML = html; overlay.hidden = false; overlay.scrollTop = 0;
  const f = overlay.querySelector('button:not([disabled])'); if (f) f.focus({ preventScroll:true });
}
const toggles = () => `<div class="toggles">
  <button class="toggle" data-act="tsfx" aria-pressed="${META.sfx}">音效</button>
  <button class="toggle" data-act="tbgm" aria-pressed="${META.bgm}">音乐</button></div>`;

function rollOptions(){
  const opts = [];
  for (const k of ACTIVE){ const ev = SK[k].evo; if (P.sk[k] === SK[k].max && !P.evo[k] && P.sk[ev.pair]) opts.push('evo:' + k); }
  opts.splice(3);
  const fav = SECTS[P.sect].fav;
  const pool = Object.keys(SK).filter(k => canTake(k));
  while (opts.length < 3 && pool.length){
    const w = pool.map(k => {
      let x = (P.sk[k] ? 2.2 : 1) * (fav.includes(k) ? 1.6 : 1);
      if (SK[k].cat === 'p' && ACTIVE.some(a => P.sk[a] && SK[a].evo.pair === k)) x *= 1.4;
      return x;
    });
    let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
    while (i < w.length - 1 && r > w[i]){ r -= w[i]; i++; }
    opts.push(pool.splice(i, 1)[0]);
  }
  if (!opts.length) opts.push('elixir', 'stones');
  return opts;
}
function card(k, i){
  const kb = `<kbd>${i + 1}</kbd>`;
  if (k === 'elixir') return `<button class="card" data-i="${i}"><span class="glyph">丹</span><span class="t"><b>回春丹</b><em>补益</em><span class="d">回复 40 点气血</span></span>${kb}</button>`;
  if (k === 'stones') return `<button class="card" data-i="${i}"><span class="glyph">石</span><span class="t"><b>灵石</b><em>补益</em><span class="d">获得 40 灵石</span></span>${kb}</button>`;
  if (k.startsWith('evo:')){
    const w = k.slice(4), E = SK[w].evo;
    return `<button class="card evo" data-i="${i}"><span class="glyph">化</span><span class="t"><b>${E.name}</b><em>${SK[w].name}进化</em><span class="d">${E.desc}</span></span>${kb}</button>`;
  }
  const s = SK[k], L = P.sk[k] || 0, nl = L + 1;
  const tag = (L ? `第 ${nl} 重` : '新' + CAT_NAME[s.cat]) + (L ? '' : `　${CAT_NAME[s.cat]}`);
  let d = s.cat === 'p' ? s.desc() : s.desc(nl);
  if (s.cat !== 'p' && nl === s.max) d += `。满重后配合「${SK[s.evo.pair].name}」可进化`;
  if (s.cat === 'p'){ const ws = ACTIVE.filter(x => P.sk[x] && SK[x].evo.pair === k).map(x => SK[x].name); if (ws.length) d += `。可助「${ws.join('」「')}」进化`; }
  return `<button class="card cat-${s.cat}" data-i="${i}"><span class="glyph">${s.icon}</span><span class="t"><b>${s.name}</b><em>${L ? tag : '新' + CAT_NAME[s.cat]}</em><span class="d">${d}</span></span>${kb}</button>`;
}
function renderLevelUp(){
  const rr = P.rerolls > 0 ? `<div class="actions"><button class="btn ghost sm" data-act="reroll">重新推演（剩 ${P.rerolls} 次）</button></div>` : '';
  showOverlay(`<div class="panel"><h2>${realmName(P.lvl)}</h2><p class="sub">武器 ${activeCount()}/${MAX_ACTIVE}　心法 ${passiveCount()}/${MAX_PASSIVE}</p><div class="cards">${curOpts.map(card).join('')}</div>${rr}</div>`);
}
function openLevelUp(){ state = 'levelup'; pendingLv--; joy = null; curOpts = rollOptions(); sfx('level'); renderLevelUp(); }
function choose(i){
  const k = curOpts[i]; if (k == null || state !== 'levelup') return;
  if (k === 'elixir') P.hp = Math.min(P.maxHp, P.hp + 40);
  else if (k === 'stones') P.stones += 40;
  else if (k.startsWith('evo:')){
    const w = k.slice(4); P.evo[w] = true;
    if (w === 'sword') syncSwords();
    if (w === 'aura') P.armor *= 0.7;
    if (w === 'wood') P.regen += 2;
    banner(SK[w].evo.name); sfx('evo');
  } else addSkill(k);
  updSkillsHud();
  if (pendingLv > 0) openLevelUp();
  else { overlay.hidden = true; state = 'play'; }
}

function openBingjie(){
  state = 'bingjie'; joy = null; P.hp = 0;
  const opts = Object.keys(P.sk).filter(k => SK[k].cat !== 'p' && P.sk[k] >= 3);
  const btns = opts.map(k => `<button class="btn ghost" data-act="bj" data-k="${k}">舍弃「${P.evo[k] ? SK[k].evo.name : SK[k].name}」<small>第 ${P.sk[k]} 重，兵解后永久失去</small></button>`).join('');
  showOverlay(`<div class="panel"><h2>兵解</h2><p class="story">肉身将毁。可舍弃一件随身武器或功法，以兵解之法崩碎其中灵力，重塑道体。此法一世只能用一次。</p>
    <div class="vlist">${btns}<button class="btn" data-act="die">身死道消</button></div></div>`);
}
function doBingjie(k){
  delete P.sk[k]; delete P.evo[k];
  if (k === 'sword') swords = [];
  if (k === 'banner') allies = allies.filter(a => a.k !== 'ghost');
  if (k === 'wind') P.storm = null;
  if (k === 'drain') beams = [];
  P.bingjie = true; P.hp = P.maxHp; P.inv = 3;
  state = 'play'; overlay.hidden = true;
  clearAround(420, 0.15); shake = 12;
  banner('兵解重生'); sfx('evo'); updSkillsHud();
}

let setupSel = { sect:META.lastSect, scene:META.lastScene };
function showTitle(){
  state = 'title'; $('hud').hidden = true; $('boss').hidden = true;
  showOverlay(`<div class="panel">
    <h1>御剑问仙<span class="seal">试玩</span></h1>
    <p class="sub">守住八分钟，渡劫飞升</p>
    <p class="help">电脑用 WASD 或方向键移动，手机按住屏幕拖动。武器与功法自动施放；踩到金色「缘」字触发奇遇；宗门会不定时下达任务。陨落后获得轮回点，可在轮回殿解锁宗门与秘境。</p>
    <p class="pts">轮回点<b>${META.pts}</b></p>
    ${META.best ? `<p class="help">最久坚持 ${fmt(META.best)}，已轮回 ${META.runs} 世${META.wins ? `，飞升 ${META.wins} 次` : ''}</p>` : ''}
    <div class="actions"><button class="btn" data-act="setup">开始修行</button><button class="btn ghost" data-act="meta">轮回殿</button></div>
    ${toggles()}</div>`);
}
function showSetup(){
  state = 'setup';
  if (!META.sects[setupSel.sect]) setupSel.sect = 'jian';
  if (!META.scenes[setupSel.scene]) setupSel.scene = 'bamboo';
  const sects = Object.keys(SECTS).map(k => { const s = SECTS[k], has = META.sects[k];
    return `<button class="pickc" data-act="ssect" data-k="${k}" aria-pressed="${setupSel.sect === k}" ${has ? '' : 'disabled'}><b>${s.name}</b><em>${s.path}，本命「${SK[s.start].name}」</em><span>${has ? s.perk : '在轮回殿解锁'}</span></button>`; }).join('');
  const scenes = Object.keys(SCENES).map(k => { const s = SCENES[k], has = META.scenes[k];
    return `<button class="pickc" data-act="sscene" data-k="${k}" aria-pressed="${setupSel.scene === k}" ${has ? '' : 'disabled'}><b>${s.name}</b><span>${has ? s.desc : '在轮回殿解锁'}</span></button>`; }).join('');
  showOverlay(`<div class="panel"><h2>出山</h2>
    <h3>宗门</h3><div class="picks">${sects}</div>
    <h3>秘境</h3><div class="picks">${scenes}</div>
    <div class="actions"><button class="btn" data-act="begin">入山修行</button><button class="btn ghost" data-act="title">返回</button></div></div>`);
}
function showMeta(){
  state = 'meta';
  const rows = Object.keys(UPS).map(k => {
    const u = UPS[k], l = upLv(k), maxed = l >= u.max, cost = upCost(k);
    const desc = (l ? `当前：${u.eff(l)}` : '尚未修习') + (maxed ? '' : `；下一重：${u.eff(l + 1)}`);
    return `<div class="mrow"><div><b>${u.name}</b><span class="pips">${'●'.repeat(l)}${'○'.repeat(u.max - l)}</span></div>
      <button class="btn sm" data-act="buy" data-k="${k}" ${maxed || META.pts < cost ? 'disabled' : ''}>${maxed ? '已圆满' : '修习 ' + cost}</button>
      <div class="mdesc">${desc}</div></div>`;
  }).join('');
  const sects = Object.keys(SECTS).filter(k => SECTS[k].cost).map(k => { const s = SECTS[k], has = META.sects[k];
    return `<div class="mrow"><div><b>${s.name}</b><span class="pips">${s.path}</span></div>
      <button class="btn sm" data-act="usect" data-k="${k}" ${has || META.pts < s.cost ? 'disabled' : ''}>${has ? '已拜入' : '拜入 ' + s.cost}</button>
      <div class="mdesc">本命「${SK[s.start].name}」。${s.perk}</div></div>`; }).join('');
  const scenes = Object.keys(SCENES).filter(k => SCENES[k].cost).map(k => { const s = SCENES[k], has = META.scenes[k];
    return `<div class="mrow"><div><b>${s.name}</b></div>
      <button class="btn sm" data-act="uscene" data-k="${k}" ${has || META.pts < s.cost ? 'disabled' : ''}>${has ? '已开启' : '开启 ' + s.cost}</button>
      <div class="mdesc">${s.desc}</div></div>`; }).join('');
  showOverlay(`<div class="panel"><h2>轮回殿</h2><p class="pts">轮回点<b>${META.pts}</b></p>
    <h3>天赋</h3><div class="mlist">${rows}</div>
    <h3>宗门</h3><div class="mlist">${sects}</div>
    <h3>秘境</h3><div class="mlist">${scenes}</div>
    <div class="actions"><button class="btn" data-act="setup">开始修行</button><button class="btn ghost" data-act="title">返回</button></div></div>`);
}
function begin(){
  META.lastSect = setupSel.sect; META.lastScene = setupSel.scene; saveMeta();
  newGame(setupSel.sect, setupSel.scene); overlay.hidden = true; $('hud').hidden = false;
  updSkillsHud(); hud(); state = 'play'; banner(SECTS[P.sect].name + '弟子，入' + SCENES[P.scene].name);
  if (SFX.ctx){ bgm.next = SFX.ctx.currentTime + 0.3; bgm.idx = 6; }
}
function pause(){
  if (state !== 'play') return;
  state = 'pause'; joy = null;
  showOverlay(`<div class="panel"><h2>闭关调息</h2><p class="sub">${realmName(P.lvl)}，已坚持 ${fmt(time)}</p>
    <p class="help">机缘 ${P.luck}，灵石 ${P.stones}${P.bingjie ? '，已兵解' : '，兵解尚可用'}</p>
    <div class="actions"><button class="btn" data-act="resume">继续修行</button><button class="btn ghost" data-act="quit">放弃此世</button></div>${toggles()}</div>`);
}
function resume(){ overlay.hidden = true; state = 'play'; }
function gameOver(win){
  if (!['play','pause','bingjie'].includes(state)) return;
  state = win ? 'win' : 'over'; joy = null;
  const sc = SCENES[P.scene];
  const earned = Math.round((Math.floor(time / 15) + Math.floor(kills / 80) + bossKills * 5 + (win ? 20 : 0)) * sc.mult);
  META.pts += earned; META.runs++; if (win) META.wins++;
  META.best = Math.max(META.best || 0, Math.floor(time)); saveMeta();
  $('hud').hidden = true; $('boss').hidden = true;
  sfx(win ? 'win' : 'lose');
  showOverlay(`<div class="panel">
    <h2>${win ? '渡劫飞升' : '身死道消'}</h2>
    <p class="sub">${win ? `${sc.name}八分钟道心不破，位列仙班。` : '道途未竟，再入轮回。'}</p>
    <div class="stats"><div>坚持<b>${fmt(time)}</b></div><div>境界<b>${realmName(P.lvl)}</b></div><div>斩妖<b>${kills}</b></div><div>斩妖王<b>${bossKills}</b></div></div>
    <p class="pts">获得轮回点<b>+${earned}</b></p>
    <p class="help">共有轮回点 ${META.pts}，最久坚持 ${fmt(META.best)}</p>
    <div class="actions"><button class="btn" data-act="setup">再入轮回</button><button class="btn ghost" data-act="meta">轮回殿</button></div></div>`);
}

overlay.addEventListener('click', e => {
  audioInit();
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const a = b.dataset.act, k = b.dataset.k;
  if (b.dataset.i != null && !a) return choose(+b.dataset.i);
  sfx('click');
  if (a === 'setup') showSetup();
  else if (a === 'ssect'){ setupSel.sect = k; showSetup(); }
  else if (a === 'sscene'){ setupSel.scene = k; showSetup(); }
  else if (a === 'begin') begin();
  else if (a === 'meta') showMeta();
  else if (a === 'title') showTitle();
  else if (a === 'resume') resume();
  else if (a === 'quit'){ state = 'play'; gameOver(false); }
  else if (a === 'reroll'){ if (P.rerolls > 0){ P.rerolls--; curOpts = rollOptions(); renderLevelUp(); } }
  else if (a === 'evopt') chooseEvent(+b.dataset.i);
  else if (a === 'evdone'){ overlay.hidden = true; state = 'play'; hud(); }
  else if (a === 'bj') doBingjie(k);
  else if (a === 'die'){ gameOver(false); }
  else if (a === 'buy'){ const c = upCost(k); if (META.pts >= c && upLv(k) < UPS[k].max){ META.pts -= c; META.up[k] = upLv(k) + 1; saveMeta(); sfx('chest'); showMeta(); } }
  else if (a === 'usect'){ const c = SECTS[k].cost; if (META.pts >= c && !META.sects[k]){ META.pts -= c; META.sects[k] = true; saveMeta(); sfx('evo'); showMeta(); } }
  else if (a === 'uscene'){ const c = SCENES[k].cost; if (META.pts >= c && !META.scenes[k]){ META.pts -= c; META.scenes[k] = true; saveMeta(); sfx('evo'); showMeta(); } }
  else if (a === 'tsfx' || a === 'tbgm'){ const key = a === 'tsfx' ? 'sfx' : 'bgm'; META[key] = !META[key]; saveMeta(); b.setAttribute('aria-pressed', META[key]); }
});
$('pauseBtn').addEventListener('click', pause);
$('muteBtn').addEventListener('click', () => { audioInit(); META.muted = !META.muted; saveMeta(); applyMute(); });
function onKey(e){
  if (e.repeat) return;
  const digit = /^Digit[1-9]$/.test(e.code) ? +e.code.slice(5) - 1 : -1;
  if (state === 'levelup' && digit >= 0 && digit < 3){ choose(digit); e.preventDefault(); }
  else if (state === 'levelup' && e.code === 'KeyR' && P.rerolls > 0){ P.rerolls--; curOpts = rollOptions(); renderLevelUp(); }
  else if (state === 'event' && curEvent && digit >= 0){ chooseEvent(digit); }
  else if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') pause();
  else if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'pause') resume();
  if (state === 'play' && e.code.startsWith('Arrow')) e.preventDefault();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
applyMute();
initWeather();

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play'){ update(dt); bgmTick(); }
  else if (!P || ['title','meta','setup'].includes(state)) updWeather(dt);
  draw();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
